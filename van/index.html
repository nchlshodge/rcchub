<style>

  .topbar h1{font-size:20px;color:var(--blue);display:flex;align-items:center;gap:10px;}
  .topbar .backlink{font-size:13px;color:var(--muted);text-decoration:none;font-weight:400;font-family:'Inter',sans-serif;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .topbar button.plain,.topbar a.plain{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:none;}
  .content{padding:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
  label{display:block;font-size:15px;font-weight:600;margin:14px 0 6px;}
  input,select,textarea{width:100%;padding:14px;font-size:16px;border:2px solid var(--border);border-radius:10px;background:#fff;color:var(--text);font-family:'Inter',sans-serif;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}
  textarea{min-height:80px;}
  button.primary{width:100%;padding:16px;font-size:17px;font-weight:600;background:var(--blue);color:#fff;border:none;border-radius:12px;margin-top:16px;cursor:pointer;font-family:'Inter',sans-serif;}
  button.primary:hover{opacity:.92;}
  button.secondary{width:100%;padding:16px;font-size:17px;font-weight:600;background:#fff;color:var(--blue);border:2px solid var(--blue);border-radius:12px;margin-top:10px;cursor:pointer;font-family:'Inter',sans-serif;}
  button.danger{background:var(--danger);}
  button:disabled{opacity:.45;cursor:default;}
  .toggle-row{display:flex;gap:12px;margin-top:10px;}
  .toggle-row button{flex:1;padding:16px;font-size:16px;border-radius:10px;border:2px solid var(--border);background:#fff;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .toggle-row button.active-yes{background:var(--safe-dim);color:var(--safe);border-color:var(--safe);}
  .toggle-row button.active-no{background:var(--danger-dim);color:var(--danger);border-color:var(--danger);}
  .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;}
  .badge.pending{background:#f5e3c3;color:#8a6100;}
  .badge.approved{background:var(--safe-dim);color:var(--safe);}
  .badge.available{background:var(--safe-dim);color:var(--safe);}
  .badge.inuse{background:#f5e3c3;color:#8a6100;}
  .badge.maintenance{background:var(--danger-dim);color:var(--danger);}
  .badge.admin{background:var(--blue-dim);color:var(--blue);}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
  .list-item:last-child{border-bottom:none;}
  .muted{color:var(--muted);font-size:14px;}
  .center{text-align:center;}
  .camera-box{border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;margin-top:8px;}
  .camera-box img{max-width:100%;border-radius:8px;margin-top:10px;}
  .upload-progress{font-size:13px;color:var(--blue);margin-top:8px;}
  .banner-safe{background:var(--safe-dim);color:var(--safe);padding:14px;border-radius:10px;margin-top:12px;font-weight:600;}
  .banner-danger{background:var(--danger-dim);color:var(--danger);padding:14px;border-radius:10px;margin-top:12px;font-weight:700;}
  .nav-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px;overflow-x:auto;}
  .nav-tabs button{flex:1;padding:12px 10px;background:none;border:none;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;font-family:'Inter',sans-serif;}

  .login-title{font-family:'Playfair Display',serif;font-size:28px;text-align:center;margin-bottom:6px;}
  .login-sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:28px;}
  #googleSignInBtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px solid #d1cdc4;border-radius:12px;padding:15px;font-size:15px;font-weight:500;cursor:pointer;width:100%;font-family:'Inter',sans-serif;}
  .loading{text-align:center;padding:40px;color:var(--muted);}

// Public key identifying this app to the browser's push service — not
// a secret, same one used across every app in the hub.
const VAPID_PUBLIC_KEY = "BBmeZ0dXYXp4_3N8q76N7_teXTbVjY7KoVshMf0rWnNe9-j9GylIXMsexSnXmPEsJrilUCP6QJ-saVcwX31OhcU";

// Registers the shared hub-wide service worker and saves this device's
// push token onto the driver's own profile. Silently does nothing on
// browsers that don't support push (e.g. iOS Safari unless the site's
// been added to the home screen).
async function enablePushNotifications() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;

  try {
    const registration = await navigator.serviceWorker.register('../firebase-messaging-sw.js', { scope: '../' });
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return null;

    const messaging = firebase.messaging();
    const token = await messaging.getToken({
      vapidKey: VAPID_PUBLIC_KEY,
      serviceWorkerRegistration: registration,
    });
    return token || null;
  } catch (e) {
    console.error('Push notification setup failed:', e);
    return null;
  }
}

// Seed vans once if the collection is empty (first-run convenience only)
async function ensureVansSeeded(){
  const snap = await db.collection('vans').limit(1).get();
  if(!snap.empty) return;
  const seed = [
    {name:'White Chevy Van (low priority use)', mileage:52310, gas:75, status:'available', lowPriority:true},
    {name:'Brown GMC Van', mileage:88120, gas:40, status:'available', lowPriority:false},
    {name:'White Ford Van', mileage:31200, gas:90, status:'available', lowPriority:false},
  ];
  const batch = db.batch();
  seed.forEach(v=>{ const ref = db.collection('vans').doc(); batch.set(ref, v); });
  await batch.commit();
}
async function ensureWarningLightsSeeded(){
  const snap = await db.collection('vanWarningLights').limit(1).get();
  if(!snap.empty) return;
  const seed = [
    {name:'Tire Pressure Light', safety:false, feedback:"That's the tire pressure light — we know about it, low priority. Thanks for flagging it, no need to call anyone."},

    {name:'Brake Warning Light', safety:true, feedback:null},

  ];
  const batch = db.batch();
  seed.forEach(l=>{ const ref = db.collection('vanWarningLights').doc(); batch.set(ref, l); });
  await batch.commit();
}

function CameraCapture({label, onCapture, photoUrl, uploading}){

// Uploads a File to Firebase Storage under a given path, returns download URL
async function uploadPhoto(file, path){
  const ref = storage.ref().child(path);
  await ref.put(file);
  return await ref.getDownloadURL();
}

// ---------- Driver Application ----------
function DriverApply({user,onDone,prefill,prefillName,prefillPhone}){
  const [form,setForm] = useState({
    birthdate:'',licenseExp: prefill?.licenseExp || '',cdl:null,
    atFaultAccidents3yr:null,atFaultAccidentsDetails:'',
    movingViolations3yr:null,movingViolationsDetails:'',
    insuranceCancelled:null,licenseRevokedSuspended:null,
  });
  const [phone,setPhone] = useState(prefillPhone || '');
  const [saving,setSaving] = useState(false);
  function set(field,val){ setForm(f=>({...f,[field]:val})); }
  const canSubmit = phone && form.birthdate && form.licenseExp && form.cdl!==null
    && form.atFaultAccidents3yr!==null && form.movingViolations3yr!==null
    && form.insuranceCancelled!==null && form.licenseRevokedSuspended!==null && !saving;

  async function submit(){
    setSaving(true);
    await db.collection('users').doc(user.uid).set({
      name: prefillName || user.displayName || '',
      email: user.email || '',
      phone,
      uid: user.uid,
      vanRentalProfile: {
        ...form, licenseVerifiedInPerson: prefill?.licenseVerifiedInPerson || false, status:'pending', createdAt: Date.now(),
      }
    }, {merge:true});
    setSaving(false);
    onDone();
  }
  return (
    <div className="content">
      <div className="card">
        <h2>Driver Application</h2>
        {prefill && (
          <div className="banner-safe" style={{marginBottom:10}}>
            An admin already added some of your info. Just finish the rest below.

        )}
        <div className="banner-safe" style={{marginBottom:6}}>
          Before you can be approved to drive, please bring a copy of your driver's license to the main office. An admin will confirm it's on file and mark your application verified.
        </div>
        <p className="muted">Fill out the rest below. You'll see your approval status once both this form and the license copy are on file.</p>

        <label>Phone Number</label>
        <input value={phone} onChange={e=>setPhone(e.target.value)} type="tel" />
        <label>Date of Birth</label>
        <input type="date" value={form.birthdate} onChange={e=>set('birthdate',e.target.value)} />
        <label>License Expiration Date</label>
        <input type="date" value={form.licenseExp} onChange={e=>set('licenseExp',e.target.value)} />
        <label>Do you hold a CDL?</label>
        <YesNo value={form.cdl} onChange={v=>set('cdl',v)} />

        <label>In the past 3 years, have you had any at-fault accidents?</label>
        <YesNo value={form.atFaultAccidents3yr} onChange={v=>set('atFaultAccidents3yr',v)} />
        {form.atFaultAccidents3yr && (<><label>Please explain</label><textarea value={form.atFaultAccidentsDetails} onChange={e=>set('atFaultAccidentsDetails',e.target.value)} /></>)}

        <label>In the past 3 years, have you had any moving traffic violations?</label>
        <YesNo value={form.movingViolations3yr} onChange={v=>set('movingViolations3yr',v)} />
        {form.movingViolations3yr && (<><label>Please explain</label><textarea value={form.movingViolationsDetails} onChange={e=>set('movingViolationsDetails',e.target.value)} /></>)}

        <label>Has an insurance company ever cancelled or refused to provide you personal auto insurance?</label>
        <YesNo value={form.insuranceCancelled} onChange={v=>set('insuranceCancelled',v)} />

        <label>Has your driver's license ever been revoked, suspended, or restricted?</label>
        <YesNo value={form.licenseRevokedSuspended} onChange={v=>set('licenseRevokedSuspended',v)} />

        <button className="primary" disabled={!canSubmit} onClick={submit}>{saving?'Submitting...':'Submit Application'}</button>
      </div>

}

// ---------- License Renewal ----------
function LicenseRenewal({user,profile,onDone}){
  const vr = profile.vanRentalProfile || {};
  const [licenseExp,setLicenseExp] = useState('');
  const [cdl,setCdl] = useState(vr.cdl ?? null);
  const [atFaultAccidents1yr,setAtFaultAccidents1yr] = useState(null);

  async function submit(){

    await db.collection('users').doc(user.uid).set({
      vanRentalProfile: {
        ...vr, licenseExp, cdl, atFaultAccidents1yr, atFaultDetails,

      }

  }
  return (

        <label>Do you hold a CDL?</label>

        <label>In the past year, have you had any moving traffic violations?</label>
        <YesNo value={movingViolations1yr} onChange={setMovingViolations1yr} />
        {movingViolations1yr && (<><label>Please explain</label><textarea value={movingDetails} onChange={e=>setMovingDetails(e.target.value)} /></>)}

        <label>Has your driver's license been revoked, suspended, or restricted since your last renewal?</label>
        <YesNo value={licenseRevokedSuspended} onChange={setLicenseRevokedSuspended} />

        <button className="primary" disabled={!canSubmit} onClick={submit}>{saving?'Saving...':'Save Renewal'}</button>
      </div>
    </div>
  );
}

// ---------- Request Rental (auto-assign) ----------
function rentalOverlaps(aStart,aEnd,bStart,bEnd){ return aStart < bEnd && bStart < aEnd; }

function RequestRental({user,vans,rentals,onAssigned}){
  const [date,setDate] = useState('');
  const [time,setTime] = useState('');
  const [endDate,setEndDate] = useState('');
  const [endTime,setEndTime] = useState('');
  const [purpose,setPurpose] = useState('');
  const [error,setError] = useState('');
  const [saving,setSaving] = useState(false);
  const [isRecurring,setIsRecurring] = useState(false);
  const [recurringDay,setRecurringDay] = useState('');

  async function autoAssign(){
    setError(''); setSaving(true);
    const start = new Date(`${date}T${time}`);
    const end = new Date(`${endDate}T${endTime}`);
    if(!(start < end)){ setError('End date/time must be after the start date/time.'); setSaving(false); return; }

    const activeRentals = rentals.filter(r=>r.status!=='completed' && r.status!=='cancelled');
    const vansWithConflict = new Set(
      activeRentals.filter(r=>{
        if(!r.date || !r.time) return false;
        const rStart = new Date(`${r.date}T${r.time}`);
        const rEnd = r.endDate && r.endTime ? new Date(`${r.endDate}T${r.endTime}`) : new Date(rStart.getTime()+4*60*60*1000);
        return rentalOverlaps(start,end,rStart,rEnd);
      }).map(r=>r.vanId)
    );

    const available = vans.filter(v=>v.status!=='maintenance' && !vansWithConflict.has(v.id));
    if(available.length===0){ setError('No vans are free for that time window. An admin will follow up.'); setSaving(false); return; }

    const van = [...available].sort((a,b)=>{
      if(!!a.lowPriority !== !!b.lowPriority) return a.lowPriority ? 1 : -1;
      return a.mileage-b.mileage;
    })[0];

    const rentalRef = db.collection('vanRentals').doc();
    await rentalRef.set({
      driverId: user.uid, vanId: van.id, date, time, endDate, endTime, purpose,
      status: 'assigned', createdAt: Date.now(),
    });
    await db.collection('vans').doc(van.id).update({status:'inuse'});
    setSaving(false);
    onAssigned();
  }

  async function submitRecurring(){
    setError(''); setSaving(true);
    if(!recurringDay || !time || !endTime || !date){
      setError('Please fill in the day, start date, and times.'); setSaving(false); return;
    }
    const windowStart = date;
    const windowEnd = addMonths(date, 3);
    await db.collection('vanRecurringRequests').add({
      driverId: user.uid, dayOfWeek: recurringDay, time, endTime, purpose,
      windowStart, windowEnd,
      status: 'pending', // pending | active | renewal_requested | ended | denied
      createdAt: Date.now(),
    });
    setSaving(false);
    onAssigned();
  }

  function addMonths(dateStr, months){
    const d = new Date(dateStr+'T00:00:00');
    d.setMonth(d.getMonth()+months);
    return d.toISOString().split('T')[0];
  }

  const canSubmitOneTime = date && time && endDate && endTime && !saving;
  const canSubmitRecurring = recurringDay && date && time && endTime && !saving;

  return (
    <div className="content">
      <div className="card">
        <h2>Request a Van</h2>

        <div className="card" style={{background:'var(--blue-dim)', border:'1px solid var(--blue-glow)', padding:14, marginBottom:0}}>
          <label style={{marginTop:0, display:'flex', alignItems:'flex-start', gap:10, cursor:'pointer'}}>
            <input type="checkbox" checked={isRecurring} onChange={e=>setIsRecurring(e.target.checked)} style={{width:'auto', marginTop:3}} />
            <span style={{fontWeight:400, fontSize:14}}>Make this a weekly reservation (e.g. same time every week for a season). An admin approves this before it starts.</span>
          </label>
        </div>

        {!isRecurring && (<>
          <label>Start Date</label>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)} />
          <label>Start Time</label>
          <input type="time" value={time} onChange={e=>setTime(e.target.value)} />
          <label>Return Date</label>
          <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} />
          <label>Return Time</label>
          <input type="time" value={endTime} onChange={e=>setEndTime(e.target.value)} />
        </>)}

        {isRecurring && (<>
          <label>Which day of the week?</label>
          <select value={recurringDay} onChange={e=>setRecurringDay(e.target.value)}>
            <option value="">Select a day...</option>
            <option value="0">Sunday</option><option value="1">Monday</option><option value="2">Tuesday</option>
            <option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option>
          </select>
          <label>Starting From</label>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)} />
          <label>Time</label>
          <input type="time" value={time} onChange={e=>setTime(e.target.value)} />
          <label>Return Time (same day, each week)</label>
          <input type="time" value={endTime} onChange={e=>setEndTime(e.target.value)} />
          <p className="muted">This requests the same day/time every week for 3 months. An admin will review and approve it, then you'll be prompted to renew before it runs out.</p>
        </>)}

        <label>Purpose / Destination</label>
        <input value={purpose} onChange={e=>setPurpose(e.target.value)} placeholder="e.g. Youth group retreat" />
        {error && <div className="banner-danger">{error}</div>}

        {!isRecurring && (
          <button className="primary" disabled={!canSubmitOneTime} onClick={autoAssign}>{saving?'Finding a van...':'Find Me a Van'}</button>
        )}
        {isRecurring && (
          <button className="primary" disabled={!canSubmitRecurring} onClick={submitRecurring}>{saving?'Submitting...':'Request Weekly Reservation'}</button>
        )}
      </div>
    </div>
  );
}

// ---------- Checkout Flow ----------
// Visual gas gauge selector — an arc from Empty to Full with 5 tap
// zones. Picking a zone sets the needle to that position. Drivers pick
// the closest reading at or below the actual needle (e.g. if it's
// between 3/4 and Full, they pick 3/4).
const GAS_LEVELS = [
  {key:'empty', label:'Empty', angle:-90, value:5},
  {key:'quarter', label:'1/4', angle:-45, value:25},
  {key:'half', label:'1/2', angle:0, value:50},
  {key:'threequarter', label:'3/4', angle:45, value:75},
  {key:'full', label:'Full', angle:90, value:100},
];
function GasGauge({value, onChange}){
  const selected = GAS_LEVELS.find(l=>l.value===value);
  const needleAngle = selected ? selected.angle : -90;
  const rad = (needleAngle-90) * Math.PI/180;
  const cx=100, cy=100, r=70;
  const needleX = cx + r*0.85*Math.cos(rad);
  const needleY = cy + r*0.85*Math.sin(rad);

  return (
    <div style={{textAlign:'center'}}>
      <svg viewBox="0 0 200 130" style={{width:'100%',maxWidth:280,margin:'0 auto',display:'block'}}>
        <path d="M 30 100 A 70 70 0 0 1 170 100" fill="none" stroke="var(--border)" strokeWidth="14" strokeLinecap="round" />
        <path d="M 30 100 A 70 70 0 0 1 170 100" fill="none" stroke="var(--blue)" strokeWidth="14" strokeLinecap="round"
          strokeDasharray={`${selected ? (GAS_LEVELS.indexOf(selected)/4)*220 : 0} 999`} />
        <line x1={cx} y1={cy} x2={needleX} y2={needleY} stroke="var(--danger)" strokeWidth="3" strokeLinecap="round" />
        <circle cx={cx} cy={cy} r="6" fill="var(--danger)" />
        <text x="30" y="118" fontSize="11" fill="var(--muted)" textAnchor="middle">E</text>
        <text x="170" y="118" fontSize="11" fill="var(--muted)" textAnchor="middle">F</text>
      </svg>
      <div style={{display:'flex',gap:6,justifyContent:'center',flexWrap:'wrap',marginTop:10}}>
        {GAS_LEVELS.map(l=>(
          <button key={l.key} type="button"
            onClick={()=>onChange(l.value)}
            style={{
              padding:'10px 14px', fontSize:14, fontWeight:600, borderRadius:10, cursor:'pointer',
              border: value===l.value ? '2px solid var(--blue)' : '2px solid var(--border)',
              background: value===l.value ? 'var(--blue-dim)' : '#fff',
              color: value===l.value ? 'var(--blue)' : 'var(--text)',
            }}>
            {l.label}
          </button>
        ))}
      </div>
      <p className="muted" style={{marginTop:8}}>Pick the closest mark at or below the needle — e.g. between 3/4 and Full, pick 3/4.</p>
    </div>
  );
}

function CheckoutFlow({user,van,rental,warningLights,onDone}){
  const draft = rental.checkoutDraft || {};
  const [keysConfirmed,setKeysConfirmed] = useState(true); // once a draft exists they've already gotten the keys
  const [mileage,setMileage] = useState(draft.mileage || '');
  const [gas,setGas] = useState(draft.gas ?? null);
  const [dashPhoto,setDashPhoto] = useState(draft.dashPhoto || null);
  const [dashUploading,setDashUploading] = useState(false);
  const [checkedLights,setCheckedLights] = useState(draft.checkedLights || []);
  const [otherLightChecked,setOtherLightChecked] = useState(draft.otherLightChecked || false);
  const [otherLightDesc,setOtherLightDesc] = useState(draft.otherLightDesc || '');
  const [clean,setClean] = useState(null);
  const [cleanPhoto,setCleanPhoto] = useState(null);
  const [cleanUploading,setCleanUploading] = useState(false);
  const [saving,setSaving] = useState(false);
  const [confirmed,setConfirmed] = useState(false);

  const relevantLights = warningLights.filter(l=>!l.van || l.van===van.id);
  const safetyLightsOn = checkedLights.filter(id => {
    const l = relevantLights.find(x=>x.id===id);
    return l && l.safety;
  });
  const nonSafetyLightsOn = checkedLights.filter(id => {
    const l = relevantLights.find(x=>x.id===id);
    return l && !l.safety;
  });

  const isBlocked = rental.checkoutBlocked && !rental.checkoutCleared;
  const wasCleared = rental.checkoutBlocked && rental.checkoutCleared;

  async function handlePhoto(file, setPhoto, setUploading){
    setUploading(true);
    const url = await uploadPhoto(file, `vanRentalPhotos/${rental.id}/${uid()}.jpg`);
    setPhoto(url);
    setUploading(false);
  }

  function toggleLight(id){
    const next = checkedLights.includes(id) ? checkedLights.filter(x=>x!==id) : [...checkedLights, id];
    setCheckedLights(next);
    const stillHasSafety = next.some(lid => relevantLights.find(l=>l.id===lid)?.safety);
    if(stillHasSafety) saveDraftAndBlock(next);
  }

  // Saves everything entered so far and flags the rental as blocked,
  // so an admin can see exactly what the driver already recorded and
  // either clear them to continue or finish checkout on their behalf.
  async function saveDraftAndBlock(lightsOverride){
    const lightIds = lightsOverride || checkedLights;
    await db.collection('vanRentals').doc(rental.id).update({
      checkoutDraft: { mileage, gas, dashPhoto, checkedLights: lightIds, otherLightChecked, otherLightDesc },
      checkoutBlocked: true, checkoutCleared: false,
    });
    const lightNames = lightIds.map(id => relevantLights.find(l=>l.id===id)?.name).filter(Boolean);
    await db.collection('vanAlerts').add({
      type:'safety_light_block', driverId:user.uid, vanId:van.id, rentalId:rental.id,
      description:`Safety light(s) checked during checkout: ${lightNames.join(', ')}`,
      createdAt:Date.now(), resolved:false,
    });
  }

  const canSubmit = keysConfirmed && mileage && gas!==null && dashPhoto
    && safetyLightsOn.length===0
    && (!otherLightChecked || otherLightDesc)
    && clean!==null && cleanPhoto && confirmed && !saving;

  async function finishCheckout(){
    setSaving(true);
    const lightNames = checkedLights.map(id => relevantLights.find(l=>l.id===id)?.name).filter(Boolean);
    await db.collection('vanRentals').doc(rental.id).update({
      checkout: {
        mileage, gas, dashPhoto,
        warningLightsOn: lightNames,
        otherLightReported: otherLightChecked, otherLightDesc,
        clean, cleanPhoto, at: Date.now(),
      },
      checkoutDraft: firebase.firestore.FieldValue.delete(),
      checkoutBlocked: false, checkoutCleared: false,
    });
    await db.collection('vans').doc(van.id).update({
      mileage: Number(mileage)||van.mileage, gas,
    });
    if(otherLightChecked && otherLightDesc){
      await db.collection('vanAlerts').add({
        type:'unknown_safety_light', driverId:user.uid, vanId:van.id, rentalId:rental.id,
        description:otherLightDesc, createdAt:Date.now(), resolved:false,
      });
    }
    setSaving(false);
    onDone();
  }

  if(isBlocked){
    return (
      <div className="content">
        <div className="card">
          <h2>Waiting on Admin</h2>
          <div className="banner-danger">
            A safety warning light was flagged during your dashboard check. An admin has been notified and needs to clear this before you can finish checking out. Please call Nicholas if you haven't already.
          </div>
          <p className="muted" style={{marginTop:14}}>What you entered so far is saved — once an admin clears this, you'll be able to pick up right where you left off.</p>
        </div>
      </div>
    );
  }

  if(!keysConfirmed){
    return (
      <div className="content">
        <div className="card">
          <h2>Get Your Keys</h2>
          <p>You've been assigned <strong>{van.name}</strong>.</p>
          <p>Keys are located in the church office key box, labeled with the van name. If the office is locked, keys are in the lockbox by the side door — ask an admin for the code if you don't have it.</p>
          <button className="primary" onClick={()=>setKeysConfirmed(true)}>I Have the Keys</button>
        </div>
      </div>
    );
  }

  return (
    <div className="content">
      <div className="card">
        <h2>Dashboard Check</h2>
        <p className="muted">One photo of the full dashboard, then confirm what it shows below.</p>
        <CameraCapture label="Take a photo of the full dashboard" photoUrl={dashPhoto} uploading={dashUploading} onCapture={f=>handlePhoto(f,setDashPhoto,setDashUploading)} />

        <label>Current Odometer Reading</label>
        <input type="number" value={mileage} onChange={e=>setMileage(e.target.value)} placeholder={`Last known: ${van.mileage}`} />

        <label>Gas Level</label>
        <GasGauge value={gas} onChange={setGas} />

        <label>Warning Lights — check off anything lit on the dash</label>
        {relevantLights.map(l=>{
          const isChecked = checkedLights.includes(l.id);
          return (
            <div key={l.id} className="toggle-row" style={{marginTop:8}}>
              <button type="button"
                onClick={()=>toggleLight(l.id)}
                style={{
                  flex:1, textAlign:'left', padding:'12px 14px', borderRadius:10, cursor:'pointer',
                  border: isChecked ? (l.safety ? '2px solid var(--danger)' : '2px solid var(--safe)') : '2px solid var(--border)',
                  background: isChecked ? (l.safety ? 'var(--danger-dim)' : 'var(--safe-dim)') : '#fff',
                  color: isChecked ? (l.safety ? 'var(--danger)' : 'var(--safe)') : 'var(--text)',
                  fontWeight: isChecked ? 700 : 500, fontSize:15,
                }}>
                {isChecked ? '☑' : '☐'} {l.name}
              </button>
            </div>
          );
        })}
        <div className="toggle-row" style={{marginTop:8}}>
          <button type="button"
            onClick={()=>setOtherLightChecked(v=>!v)}
            style={{
              flex:1, textAlign:'left', padding:'12px 14px', borderRadius:10, cursor:'pointer',
              border: otherLightChecked ? '2px solid var(--danger)' : '2px solid var(--border)',
              background: otherLightChecked ? 'var(--danger-dim)' : '#fff',
              color: otherLightChecked ? 'var(--danger)' : 'var(--text)',
              fontWeight: otherLightChecked ? 700 : 500, fontSize:15,
            }}>
            {otherLightChecked ? '☑' : '☐'} Something else / not on this list
          </button>
        </div>
        {otherLightChecked && (
          <>
            <label>Describe what you see</label>
            <textarea value={otherLightDesc} onChange={e=>setOtherLightDesc(e.target.value)} placeholder="Describe the light or symbol" />
            {otherLightDesc && <div className="banner-danger">We don't have this one on file. Please call Nicholas right now before driving. We've also notified the admin team.</div>}
          </>
        )}
        {nonSafetyLightsOn.length>0 && (
          <div className="banner-safe">
            {nonSafetyLightsOn.map(id => relevantLights.find(l=>l.id===id)?.feedback).filter(Boolean).join(' ')}
          </div>
        )}
        {safetyLightsOn.length>0 && (
          <div className="banner-danger">
            {safetyLightsOn.map(id=>relevantLights.find(l=>l.id===id)?.name).join(', ')} — this is a known safety issue. Please call Nicholas right now before taking the van.
          </div>
        )}

        <label style={{marginTop:20}}>Is the van clean?</label>
        <YesNo value={clean} onChange={setClean} />
        <CameraCapture label="Take a photo of the van interior" photoUrl={cleanPhoto} uploading={cleanUploading} onCapture={f=>handlePhoto(f,setCleanPhoto,setCleanUploading)} />

        <div className="card" style={{background:'var(--blue-dim)', border:'1px solid var(--blue-glow)', marginTop:20, padding:14}}>
          <label style={{marginTop:0, display:'flex', alignItems:'flex-start', gap:10, cursor:'pointer'}}>
            <input type="checkbox" checked={confirmed} onChange={e=>setConfirmed(e.target.checked)} style={{width:'auto', marginTop:3}} />
            <span style={{fontWeight:400, fontSize:14}}>I confirm the mileage, gas level, and warning lights above match what I see on the dashboard.</span>
          </label>
        </div>

        <button className="primary" disabled={!canSubmit} onClick={finishCheckout}>
          {saving ? 'Saving...' : (safetyLightsOn.length>0 ? 'Call Nicholas before continuing' : 'Confirm & Drive Safely')}
        </button>
      </div>
    </div>
  );
}

// ---------- Driver Home ----------
function DriverHome({user,profile,vans,rentals,warningLights,refreshProfile}){
  const [view,setView] = useState('home');
  const [selectedReturnId,setSelectedReturnId] = useState(null);
  const [myRecurring,setMyRecurring] = useState([]);
  const [enablingReminders,setEnablingReminders] = useState(false);
  const vr = profile.vanRentalProfile || {};
  const myRentals = rentals.filter(r=>r.driverId===user.uid);
  const remindersEnabled = typeof Notification!=='undefined' && Notification.permission==='granted';

  async function enableReminders(){
    setEnablingReminders(true);
    const token = await enablePushNotifications();
    if(token){
      await db.collection('users').doc(user.uid).set({
        pushTokens: firebase.firestore.FieldValue.arrayUnion(token)
      }, {merge:true});
      if(refreshProfile) refreshProfile();
    }
    setEnablingReminders(false);
  }

  useEffect(()=>{
    const unsub = db.collection('vanRecurringRequests').where('driverId','==',user.uid).onSnapshot(s=>{
      setMyRecurring(s.docs.map(d=>({id:d.id,...d.data()})));
    });
    return unsub;
  },[user.uid]);

  // A recurring reservation is "renewal due" once its window ends
  // within the next 7 days and the driver hasn't already asked to
  // continue (or let it end). Since there's no backend scheduler,
  // this only gets checked whenever the driver happens to open the
  // app — there's no proactive email/text reminder.
  const oneWeekFromNow = new Date(); oneWeekFromNow.setDate(oneWeekFromNow.getDate()+7);
  const renewalDue = myRecurring.find(r=>{
    if(r.status!=='active') return false;
    const windowEnd = new Date(r.windowEnd+'T00:00:00');
    return windowEnd <= oneWeekFromNow;
  });

  async function requestRenewal(reqId){
    await db.collection('vanRecurringRequests').doc(reqId).update({status:'renewal_requested', renewalRequestedAt: Date.now()});
  }
  async function declineRenewal(reqId){
    await db.collection('vanRecurringRequests').doc(reqId).update({status:'ended', endedAt: Date.now()});
  }

  // Checkout is personal — only the driver who requested the van sees
  // their own pending checkout. Returns are NOT personal — any
  // approved driver can complete the check-in for ANY van that's
  // currently out, since the person bringing it back (e.g. a
  // department head wrapping up a group trip) isn't always the same
  // person who originally checked it out.
  const myPendingCheckout = myRentals.find(r=>r.status==='assigned' && !r.checkout);
  const anyOutstandingReturn = selectedReturnId
    ? rentals.find(r=>r.id===selectedReturnId)
    : null;
  // If the driver explicitly clicked "Check It In" on a specific van
  // (selectedReturnId is set), that takes priority — otherwise a
  // stray pending checkout of their own would silently block them
  // from ever completing someone else's return.
  const activeRental = selectedReturnId ? anyOutstandingReturn : (myPendingCheckout || anyOutstandingReturn);
  const activeVan = activeRental ? vans.find(v=>v.id===activeRental.vanId) : null;
  const outstandingReturns = rentals.filter(r=>r.checkout && !r.return);


  if(!vr.status){
    return <DriverApply user={user} onDone={refreshProfile} />;
  }
  if(vr.status==='needs_info'){
    return <DriverApply user={user} onDone={refreshProfile} prefill={vr} prefillName={profile.name} prefillPhone={profile.phone} />;
  }
  if(vr.status==='pending'){
    return (
      <div className="content">
        <div className="card center">
          <h2>Application Pending</h2>
          {vr.licenseVerifiedInPerson ? (
            <p className="muted">Thanks! Your license is on file. An admin will finish reviewing your application shortly.</p>
          ) : (
            <div className="banner-safe" style={{textAlign:'left'}}>
              Almost there — please bring a copy of your driver's license to the main office so an admin can confirm it's on file. Your application won't be approved until that's done.
            </div>
          )}
        </div>
      </div>
    );
  }
  if(vr.status==='denied'){
    return (
      <div className="content">
        <div className="card center">
          <h2>Application Not Approved</h2>
          <p className="muted">Please reach out to an admin if you have questions.</p>
        </div>
      </div>
    );
  }

  if(view==='renew') return <LicenseRenewal user={user} profile={profile} onDone={()=>{setView('home'); refreshProfile();}} />;
  if(view==='request') return <RequestRental user={user} vans={vans} rentals={rentals} onAssigned={()=>setView('home')} />;

  if(activeRental && activeVan && !activeRental.checkout){
    return <CheckoutFlow user={user} van={activeVan} rental={activeRental} warningLights={warningLights} onDone={()=>{setSelectedReturnId(null); setView('home');}} />;
  }
  if(activeRental && activeVan && activeRental.checkout && !activeRental.return){
    return <ReturnFlow user={user} van={activeVan} rental={activeRental} warningLights={warningLights} onDone={()=>{setSelectedReturnId(null); setView('home');}} />;
  }

  return (
    <div className="content">
      {renewalDue && (
        <div className="card" style={{background:'var(--blue-dim)', border:'1px solid var(--blue-glow)'}}>
          <h3 style={{marginTop:0}}>Weekly Reservation Ending Soon</h3>
          <p className="muted">Your {DAY_NAMES[renewalDue.dayOfWeek]} {renewalDue.time}–{renewalDue.endTime} reservation runs through {renewalDue.windowEnd}. Want to continue for another 3 months?</p>
          <div style={{display:'flex',gap:8,marginTop:10}}>
            <button className="primary" style={{marginTop:0}} onClick={()=>requestRenewal(renewalDue.id)}>Yes, Continue</button>
            <button className="secondary" style={{marginTop:0}} onClick={()=>declineRenewal(renewalDue.id)}>No, Let It End</button>
          </div>
        </div>
      )}
      <div className="card">
        <h2>Welcome, {(profile.name||user.displayName||'').split(' ')[0]}</h2>
        <p className="muted">License expires {vr.licenseExp}</p>
        <button className="primary" onClick={()=>setView('request')}>Request a Van</button>
        <button className="secondary" onClick={()=>setView('renew')}>Renew My License</button>
        {!remindersEnabled && (
          <button className="secondary" disabled={enablingReminders} onClick={enableReminders}>
            {enablingReminders ? 'Enabling…' : 'Enable Reservation Reminders'}
          </button>
        )}
      </div>

      {outstandingReturns.length>0 && (
        <div className="card">
          <h3>Vans Still Out</h3>
          <p className="muted">Anyone approved to drive can check one of these back in — doesn't have to be who checked it out.</p>
          {outstandingReturns.map(r=>{
            const van = vans.find(v=>v.id===r.vanId);
            return (
              <div key={r.id} className="list-item">
                <div><div>{van?.name}</div><div className="muted">Out since {r.date} {r.time}</div></div>
                <button className="secondary" style={{marginTop:0, width:'auto', padding:'8px 14px'}} onClick={()=>setSelectedReturnId(r.id)}>Check It In</button>
              </div>
            );
          })}
        </div>
      )}

      <div className="card">
        <h3>My Rental History</h3>
        {myRentals.length===0 && <p className="muted">No rentals yet.</p>}
        {myRentals.slice().reverse().map(r=>{
          const van = vans.find(v=>v.id===r.vanId);
          return (
            <div key={r.id} className="list-item">
              <div><div>{van?.name}</div><div className="muted">{r.date} {r.time}</div></div>
              <span className={`badge ${r.status==='completed'?'available':'inuse'}`}>{r.status}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function LoginScreen(){
  function signIn(){
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(err=>alert('Sign-in failed: '+err.message));
  }
  return (
    <div className="content">
      <div className="login-mark">🚐</div>
      <div className="login-title">RCC Van Usage</div>
      <p className="login-sub">Sign in to request a van or check one in/out.</p>
      <button id="googleSignInBtn" onClick={signIn}>
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </button>
    </div>
  );
}

function App(){
  const [user,setUser] = useState(undefined); // undefined = checking, null = signed out
  const [profile,setProfile] = useState(null);
  const [canAccessAdmin,setCanAccessAdmin] = useState(false);
  const [vans,setVans] = useState([]);
  const [rentals,setRentals] = useState([]);
  const [warningLights,setWarningLights] = useState([]);
  const [loadingData,setLoadingData] = useState(true);

  async function refreshProfile(){
    if(!auth.currentUser) return;
    const doc = await db.collection('users').doc(auth.currentUser.uid).get();
    setProfile(doc.exists ? doc.data() : {});
  }

  useEffect(()=>{
    auth.onAuthStateChanged(async u=>{
      setUser(u);
      if(u){
        await ensureVansSeeded();
        await ensureWarningLightsSeeded();
        await claimDriverInviteIfAny(u);
        const doc = await db.collection('users').doc(u.uid).get();
        const data = doc.exists ? doc.data() : {};
        setProfile(data);
        setCanAccessAdmin(data.isAdmin===true || (data.roles && data.roles.vanAdmin===true));
      } else {
        setProfile(null); setCanAccessAdmin(false);
      }
    });
  },[]);

  // If this person was pre-registered by an admin (via direct invite link,
  // or by matching email), merge that invite's info into their real
  // users/{uid} doc so they land on "pending" or "approved" instead of a
  // blank application. Only runs if they don't already have a vanRentalProfile.
  async function claimDriverInviteIfAny(u){
    const existing = await db.collection('users').doc(u.uid).get();
    if(existing.exists && existing.data().vanRentalProfile) return; // already has one, don't overwrite

    const params = new URLSearchParams(window.location.search);
    const token = params.get('invite');
    let inviteDoc = null;

    if(token){
      const doc = await db.collection('vanDriverInvites').doc(token).get();
      if(doc.exists && !doc.data().claimed) inviteDoc = doc;
    }
    if(!inviteDoc && u.email){
      const snap = await db.collection('vanDriverInvites')
        .where('email','==',u.email.toLowerCase().trim())
        .where('claimed','==',false)
        .limit(1).get();
      if(!snap.empty) inviteDoc = snap.docs[0];
    }
    if(!inviteDoc) return;

    const inv = inviteDoc.data();
    await db.collection('users').doc(u.uid).set({
      name: u.displayName || inv.name || '',
      email: u.email || inv.email || '',
      phone: inv.phone || '',
      uid: u.uid,
      vanRentalProfile: {
        birthdate:'', licenseExp: inv.licenseExp||'', cdl:null,
        atFaultAccidents3yr:null, atFaultAccidentsDetails:'',
        movingViolations3yr:null, movingViolationsDetails:'',
        insuranceCancelled:null, licenseRevokedSuspended:null,
        licenseVerifiedInPerson: inv.licenseVerifiedInPerson||false,
        status:'needs_info', createdAt: Date.now(), addedByAdmin:true,
      }
    }, {merge:true});
    await db.collection('vanDriverInvites').doc(inviteDoc.id).update({claimed:true, claimedBy:u.uid, claimedAt:Date.now()});

    if(token){
      window.history.replaceState({}, '', window.location.pathname);
    }
  }

  useEffect(()=>{
    if(!user) return;
    const unsubs = [];
    unsubs.push(db.collection('vans').onSnapshot(s=>setVans(s.docs.map(d=>({id:d.id,...d.data()})))));
    unsubs.push(db.collection('vanRentals').onSnapshot(s=>setRentals(s.docs.map(d=>({id:d.id,...d.data()})))));
    unsubs.push(db.collection('vanWarningLights').onSnapshot(s=>setWarningLights(s.docs.map(d=>({id:d.id,...d.data()})))));
    setLoadingData(false);
    return ()=>unsubs.forEach(u=>u());
  },[user]);

  if(user===undefined){
    return <div className="app"><div className="loading">Loading...</div></div>;
  }
  if(!user){
    return (
      <div className="app">
        <TopBar title="RCC Van Usage" hubLink />
        <LoginScreen />
      </div>
    );
  }
  if(loadingData || profile===null){
    return <div className="app"><div className="loading">Loading your info...</div></div>;
  }

  return (
    <div className="app">
      <TopBar
        title="Van Usage"
        hubLink
        right={<>
          {canAccessAdmin && <a className="plain" href="admin.html" style={{textDecoration:'none', display:'inline-block', textAlign:'center'}}>Admin</a>}
          <button className="plain" onClick={()=>auth.signOut()}>Sign out</button>
        </>}
      />
      <DriverHome user={user} profile={profile} vans={vans} rentals={rentals} warningLights={warningLights} refreshProfile={refreshProfile} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
