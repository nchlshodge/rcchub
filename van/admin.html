<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400;500;600&display=swap');
  :root{
    --blue:#2557b8; --blue-dim:rgba(37,87,184,.08); --blue-glow:rgba(37,87,184,.20);
    --bg:#f7f6f3; --card:#ffffff; --text:#1a1a1a;
    --muted:#7a746a; --danger:#a03030; --danger-dim:rgba(160,48,48,.08);
    --safe:#2e7a52; --safe-dim:rgba(46,122,82,.08); --border:#e8e4dc;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);}
  h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0 0 8px;font-weight:400;}
  .app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:40px;}
  .topbar{background:#fff;border-bottom:1px solid var(--border);color:var(--text);padding:0 20px;height:60px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;}
  .topbar h1{font-size:20px;color:var(--blue);display:flex;align-items:center;gap:10px;}
  .topbar .backlink{font-size:13px;color:var(--muted);text-decoration:none;font-weight:400;font-family:'Inter',sans-serif;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .topbar button.plain,.topbar a.plain{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:none;}
  .content{padding:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
  label{display:block;font-size:15px;font-weight:600;margin:14px 0 6px;}
  input,select,textarea{width:100%;padding:14px;font-size:16px;border:2px solid var(--border);border-radius:10px;background:#fff;color:var(--text);font-family:'Inter',sans-serif;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}
  textarea{min-height:80px;}
  button.primary{width:100%;padding:16px;font-size:17px;font-weight:600;background:var(--blue);color:#fff;border:none;border-radius:12px;margin-top:16px;cursor:pointer;font-family:'Inter',sans-serif;}
  button.primary:hover{opacity:.92;}
  button.secondary{width:100%;padding:16px;font-size:17px;font-weight:600;background:#fff;color:var(--blue);border:2px solid var(--blue);border-radius:12px;margin-top:10px;cursor:pointer;font-family:'Inter',sans-serif;}
  button.danger{background:var(--danger);}
  button:disabled{opacity:.45;cursor:default;}
  .toggle-row{display:flex;gap:12px;margin-top:10px;}
  .toggle-row button{flex:1;padding:16px;font-size:16px;border-radius:10px;border:2px solid var(--border);background:#fff;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .toggle-row button.active-yes{background:var(--safe-dim);color:var(--safe);border-color:var(--safe);}
  .toggle-row button.active-no{background:var(--danger-dim);color:var(--danger);border-color:var(--danger);}
  .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;}
  .badge.pending{background:#f5e3c3;color:#8a6100;}
  .badge.approved{background:var(--safe-dim);color:var(--safe);}
  .badge.available{background:var(--safe-dim);color:var(--safe);}
  .badge.inuse{background:#f5e3c3;color:#8a6100;}
  .badge.maintenance{background:var(--danger-dim);color:var(--danger);}
  .badge.admin{background:var(--blue-dim);color:var(--blue);}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
  .list-item:last-child{border-bottom:none;}
  .muted{color:var(--muted);font-size:14px;}
  .center{text-align:center;}
  .camera-box{border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;margin-top:8px;}
  .camera-box img{max-width:100%;border-radius:8px;margin-top:10px;}
  .upload-progress{font-size:13px;color:var(--blue);margin-top:8px;}
  .banner-safe{background:var(--safe-dim);color:var(--safe);padding:14px;border-radius:10px;margin-top:12px;font-weight:600;}
  .banner-danger{background:var(--danger-dim);color:var(--danger);padding:14px;border-radius:10px;margin-top:12px;font-weight:700;}
  .nav-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px;overflow-x:auto;}
  .nav-tabs button{flex:1;padding:12px 10px;background:none;border:none;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;font-family:'Inter',sans-serif;}
  .nav-tabs button.active{color:var(--blue);border-bottom-color:var(--blue);}
  .link-btn{background:none;border:none;color:var(--blue);font-size:15px;font-weight:600;text-decoration:underline;padding:8px 0;cursor:pointer;font-family:'Inter',sans-serif;}
  .step-dot{display:flex;gap:6px;justify-content:center;margin-bottom:16px;padding-top:16px;}
  .step-dot span{width:8px;height:8px;border-radius:50%;background:var(--border);}
  .step-dot span.on{background:var(--blue);}
  .login-mark{width:72px;height:72px;margin:40px auto 12px;display:flex;align-items:center;justify-content:center;font-size:34px;}
  .login-title{font-family:'Playfair Display',serif;font-size:28px;text-align:center;margin-bottom:6px;}
  .login-sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:28px;}
  #googleSignInBtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px solid #d1cdc4;border-radius:12px;padding:15px;font-size:15px;font-weight:500;cursor:pointer;width:100%;font-family:'Inter',sans-serif;}
  .loading{text-align:center;padding:40px;color:var(--muted);}
</style>
</head>

function uid(){ return Math.random().toString(36).slice(2,10); }

// Seed vans once if the collection is empty (first-run convenience only)
async function ensureVansSeeded(){
  const snap = await db.collection('vans').limit(1).get();
  if(!snap.empty) return;
  const seed = [
    {name:'White Chevy Van (low priority use)', mileage:52310, gas:75, status:'available', lowPriority:true},
    {name:'Brown GMC Van', mileage:88120, gas:40, status:'available', lowPriority:false},
    {name:'White Ford Van', mileage:31200, gas:90, status:'available', lowPriority:false},
  ];
  const batch = db.batch();
  seed.forEach(v=>{ const ref = db.collection('vans').doc(); batch.set(ref, v); });
  await batch.commit();
}
async function ensureWarningLightsSeeded(){
  const snap = await db.collection('vanWarningLights').limit(1).get();
  if(!snap.empty) return;
  const seed = [
    {name:'Tire Pressure Light', safety:false, feedback:"That's the tire pressure light — we know about it, low priority. Thanks for flagging it, no need to call anyone."},
    {name:'Check Engine Light (known emissions sensor)', safety:false, feedback:"That's a known issue — not a safety concern. Go ahead and drive.", van:null},
    {name:'Brake Warning Light', safety:true, feedback:null},
    {name:'Oil Pressure Light', safety:true, feedback:null},
  ];
  const batch = db.batch();
  seed.forEach(l=>{ const ref = db.collection('vanWarningLights').doc(); batch.set(ref, l); });
  await batch.commit();
}

// ---------- Small components ----------
function TopBar({title,onBack,right,hubLink}){
  return (
    <div className="topbar">
      <h1>
        {hubLink && <a className="backlink" href="../index.html">← All apps</a>}
        {onBack && <button className="plain" onClick={onBack}>← Back</button>}
        {title}
      </h1>
      <div className="topbar-right">{right}</div>
    </div>
  );
}

function YesNo({value,onChange,yesLabel="Yes",noLabel="No"}){
  return (
    <div className="toggle-row">
      <button type="button" className={value===true?'active-yes':''} onClick={()=>onChange(true)}>{yesLabel}</button>
      <button type="button" className={value===false?'active-no':''} onClick={()=>onChange(false)}>{noLabel}</button>
    </div>
  );
}

function CameraCapture({label, onCapture, photoUrl, uploading}){
  const inputRef = useRef();
  return (
    <div className="camera-box">
      <div className="muted">{label}</div>
      <input ref={inputRef} type="file" accept="image/*" capture="environment" style={{display:'none'}}
        onChange={e=>{ const file = e.target.files[0]; if(file) onCapture(file); }} />
      <button type="button" className="secondary" style={{marginTop:10}} onClick={()=>inputRef.current.click()} disabled={uploading}>
        📷 {uploading ? 'Uploading...' : (photoUrl ? 'Retake Photo' : 'Open Camera')}
      </button>
      {uploading && <div className="upload-progress">Uploading photo…</div>}
      {photoUrl && !uploading && <img src={photoUrl} alt="capture" />}
    </div>
  );
}

// Uploads a File to Firebase Storage under a given path, returns download URL
async function uploadPhoto(file, path){
  const ref = storage.ref().child(path);
  await ref.put(file);
  return await ref.getDownloadURL();
}

// Visual gas gauge selector — an arc from Empty to Full with 5 tap
// zones. Picking a zone sets the needle to that position. Drivers pick
// the closest reading at or below the actual needle (e.g. if it's
// between 3/4 and Full, they pick 3/4).
const GAS_LEVELS = [
  {key:'empty', label:'Empty', angle:-90, value:5},
  {key:'quarter', label:'1/4', angle:-45, value:25},
  {key:'half', label:'1/2', angle:0, value:50},
  {key:'threequarter', label:'3/4', angle:45, value:75},
  {key:'full', label:'Full', angle:90, value:100},
];
function GasGauge({value, onChange}){
  const selected = GAS_LEVELS.find(l=>l.value===value);
  const needleAngle = selected ? selected.angle : -90;
  const rad = (needleAngle-90) * Math.PI/180;
  const cx=100, cy=100, r=70;
  const needleX = cx + r*0.85*Math.cos(rad);
  const needleY = cy + r*0.85*Math.sin(rad);

  return (
    <div style={{textAlign:'center'}}>
      <svg viewBox="0 0 200 130" style={{width:'100%',maxWidth:280,margin:'0 auto',display:'block'}}>
        <path d="M 30 100 A 70 70 0 0 1 170 100" fill="none" stroke="var(--border)" strokeWidth="14" strokeLinecap="round" />
        <path d="M 30 100 A 70 70 0 0 1 170 100" fill="none" stroke="var(--blue)" strokeWidth="14" strokeLinecap="round"
          strokeDasharray={`${selected ? (GAS_LEVELS.indexOf(selected)/4)*220 : 0} 999`} />
        <line x1={cx} y1={cy} x2={needleX} y2={needleY} stroke="var(--danger)" strokeWidth="3" strokeLinecap="round" />
        <circle cx={cx} cy={cy} r="6" fill="var(--danger)" />
        <text x="30" y="118" fontSize="11" fill="var(--muted)" textAnchor="middle">E</text>
        <text x="170" y="118" fontSize="11" fill="var(--muted)" textAnchor="middle">F</text>
      </svg>
      <div style={{display:'flex',gap:6,justifyContent:'center',flexWrap:'wrap',marginTop:10}}>
        {GAS_LEVELS.map(l=>(
          <button key={l.key} type="button"
            onClick={()=>onChange(l.value)}
            style={{
              padding:'10px 14px', fontSize:14, fontWeight:600, borderRadius:10, cursor:'pointer',
              border: value===l.value ? '2px solid var(--blue)' : '2px solid var(--border)',
              background: value===l.value ? 'var(--blue-dim)' : '#fff',
              color: value===l.value ? 'var(--blue)' : 'var(--text)',
            }}>
            {l.label}
          </button>
        ))}
      </div>
      <p className="muted" style={{marginTop:8}}>Pick the closest mark at or below the needle — e.g. between 3/4 and Full, pick 3/4.</p>
    </div>
  );
}

// ---------- Admin Dashboard ----------
function VanDetailCard({van,maintenanceNotes,repairLog,onSetStatus,onRemove,onResolveMaint}){
  const [expanded,setExpanded] = useState(false);
  const openNotes = maintenanceNotes.filter(m=>!m.resolved);
  const sortedRepairs = repairLog.slice().sort((a,b)=>b.createdAt-a.createdAt);

  return (
    <div className="list-item" style={{flexDirection:'column',alignItems:'stretch'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'}} onClick={()=>setExpanded(e=>!e)}>
        <div>
          <div>{van.name} {van.lowPriority && <span className="badge pending">low priority</span>} {van.borrowed && <span className="badge admin">borrowed</span>} {openNotes.length>0 && <span className="badge maintenance">{openNotes.length} open issue{openNotes.length===1?'':'s'}</span>}</div>
          <div className="muted">{van.mileage} mi · {van.gas}% gas</div>
          {van.borrowed && <div className="muted">From {van.borrowedFrom || 'unspecified org'}{van.expectedReturnDate ? ` · return by ${van.expectedReturnDate}` : ''}</div>}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span className={`badge ${van.status}`}>{van.status}</span>
          <span className="muted">{expanded?'▲':'▼'}</span>
        </div>
      </div>

      {expanded && (
        <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--border)'}}>
          <h4 style={{fontSize:14,marginBottom:6}}>Maintenance Notes</h4>
          {maintenanceNotes.length===0 && <p className="muted">No notes on file for this van.</p>}
          {maintenanceNotes.slice().reverse().map(m=>(
            <div key={m.id} className="list-item" style={{opacity:m.resolved?0.5:1}}>
              <div className="muted">{m.note} {m.resolved && '(resolved)'}</div>
              {!m.resolved && <button className="secondary" style={{marginTop:0,width:'auto',padding:'6px 10px'}} onClick={()=>onResolveMaint(m.id)}>Resolve</button>}
            </div>
          ))}

          <h4 style={{fontSize:14,marginTop:16,marginBottom:6}}>Repair History</h4>
          {sortedRepairs.length===0 && <p className="muted">No repairs logged for this van.</p>}
          {sortedRepairs.map(r=>(
            <div key={r.id} className="muted" style={{marginBottom:6}}>
              {r.date} — {r.serviceType}{r.performedBy ? ` (by ${r.performedBy})` : ''}{r.notes ? `: ${r.notes}` : ''}
            </div>
          ))}
        </div>
      )}

      <div style={{display:'flex',gap:8,marginTop:8,flexWrap:'wrap'}}>
        {van.status!=='maintenance'
          ? <button className="secondary" style={{marginTop:0}} onClick={()=>onSetStatus(van.id,'maintenance')}>Send to Maintenance</button>
          : <button className="secondary" style={{marginTop:0}} onClick={()=>onSetStatus(van.id,'available')}>Mark Available</button>}
        <button className="secondary" style={{marginTop:0,color:'var(--danger)',borderColor:'var(--danger)'}} onClick={()=>onRemove(van.id)}>
          {van.borrowed ? 'Returned — Remove' : 'Remove'}
        </button>
      </div>
    </div>
  );
}

function AddVanForm({onAdd}){
  const [name,setName] = useState('');
  const [isBorrowed,setIsBorrowed] = useState(false);
  const [borrowedFrom,setBorrowedFrom] = useState('');
  const [returnDate,setReturnDate] = useState('');
  const [saving,setSaving] = useState(false);

  async function submit(){
    setSaving(true);
    await onAdd(name, isBorrowed, borrowedFrom, returnDate);
    setName(''); setIsBorrowed(false); setBorrowedFrom(''); setReturnDate('');
    setSaving(false);
  }

  return (
    <div style={{marginTop:20, paddingTop:20, borderTop:'1px solid var(--border)'}}>
      <h3>Add a Van</h3>
      <p className="muted">For your own fleet, or a vehicle borrowed from another organization for a season or event.</p>
      <label>Van Name</label>
      <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. First Baptist's 15-passenger van" />
      <label>Is this a borrowed vehicle?</label>
      <YesNo value={isBorrowed} onChange={setIsBorrowed} />
      {isBorrowed && (<>
        <label>Borrowed From</label>
        <input value={borrowedFrom} onChange={e=>setBorrowedFrom(e.target.value)} placeholder="Organization name" />
        <label>Expected Return Date</label>
        <input type="date" value={returnDate} onChange={e=>setReturnDate(e.target.value)} />
      </>)}
      <button className="primary" disabled={!name || saving} onClick={submit}>{saving?'Adding...':'Add Van'}</button>
    </div>
  );
}

function AdminAddDriver(){
  const [name,setName] = useState('');
  const [email,setEmail] = useState('');
  const [phone,setPhone] = useState('');
  const [licenseExp,setLicenseExp] = useState('');
  const [licenseVerified,setLicenseVerified] = useState(false);
  const [saving,setSaving] = useState(false);
  const [generatedLink,setGeneratedLink] = useState(null);
  const [invites,setInvites] = useState([]);

  useEffect(()=>{
    const unsub = db.collection('vanDriverInvites').where('claimed','==',false).onSnapshot(snap=>{
      setInvites(snap.docs.map(d=>({id:d.id,...d.data()})));
    });
    return unsub;
  },[]);

  const canSubmit = name && email && !saving;

  async function createInvite(){
    setSaving(true);
    const token = uid()+uid();
    await db.collection('vanDriverInvites').doc(token).set({
      name, email: email.toLowerCase().trim(), phone, licenseExp,
      licenseVerifiedInPerson: licenseVerified,
      claimed:false, createdAt:Date.now(),
    });
    const url = new URL(window.location.href);
    url.searchParams.set('invite', token);
    setGeneratedLink(url.toString());
    setName(''); setEmail(''); setPhone(''); setLicenseExp(''); setLicenseVerified(false);
    setSaving(false);
  }

  async function deleteInvite(token){
    if(!confirm('Remove this invite? The person will need a new one if you want to add them again.')) return;
    await db.collection('vanDriverInvites').doc(token).delete();
  }

  return (
    <div className="card">
      <h3>Add an Existing Driver</h3>
      <p className="muted">For people already approved to drive before this app existed, or anyone you'd rather set up yourself. When they sign in with the matching email, their info here fills in automatically. You can also send them the link directly as a shortcut.</p>

      <label>Full Name</label>
      <input value={name} onChange={e=>setName(e.target.value)} />
      <label>Email (must match their Google sign-in)</label>
      <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="name@example.com" />
      <label>Phone Number</label>
      <input value={phone} onChange={e=>setPhone(e.target.value)} type="tel" />
      <label>License Expiration Date (if known)</label>
      <input type="date" value={licenseExp} onChange={e=>setLicenseExp(e.target.value)} />
      <label>Has this person's license already been seen in person?</label>
      <YesNo value={licenseVerified} onChange={setLicenseVerified} />

      <button className="primary" disabled={!canSubmit} onClick={createInvite}>{saving?'Creating...':'Add Driver'}</button>

      {generatedLink && (
        <div className="banner-safe" style={{wordBreak:'break-all', marginTop:14}}>
          Added! If you'd like, you can also send this direct link — it's optional since matching by email works automatically once they sign in:
          <div style={{marginTop:8,fontWeight:400,fontSize:14}}>{generatedLink}</div>
          <button className="secondary" style={{marginTop:10}} onClick={()=>navigator.clipboard.writeText(generatedLink)}>Copy Link</button>
        </div>
      )}

      <h3 style={{marginTop:24}}>Awaiting First Sign-In</h3>
      {invites.length===0 && <p className="muted">None waiting.</p>}
      {invites.map(inv=>{
        const url = new URL(window.location.href);
        url.searchParams.set('invite', inv.id);
        return (
          <div key={inv.id} className="list-item" style={{flexDirection:'column',alignItems:'stretch'}}>
            <div><strong>{inv.name}</strong> — {inv.email}</div>
            <div className="muted" style={{wordBreak:'break-all'}}>{url.toString()}</div>
            <div style={{display:'flex',gap:8,marginTop:8}}>
              <button className="secondary" style={{marginTop:0}} onClick={()=>navigator.clipboard.writeText(url.toString())}>Copy Link</button>
              <button className="secondary" style={{marginTop:0,color:'var(--danger)',borderColor:'var(--danger)'}} onClick={()=>deleteInvite(inv.id)}>Remove</button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function PendingDriverCard({driverUser,onApprove,onDeny,onVerify,onUpdateExp}){
  const vr = driverUser.vanRentalProfile;
  const [editingExp,setEditingExp] = useState(false);
  const [expDraft,setExpDraft] = useState(vr.licenseExp||'');
  const needsVerify = !vr.licenseVerifiedInPerson;

  return (
    <div className="list-item" style={{flexDirection:'column',alignItems:'stretch'}}>
      <div><strong>{driverUser.name}</strong> — {driverUser.phone}</div>
      <div className="muted">DOB: {vr.birthdate}</div>
      <div className="muted" style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
        {!editingExp ? (
          <>License expires: {vr.licenseExp || '(not set)'} {vr.cdl ? '· CDL' : ''}
            <button className="link-btn" style={{padding:0,fontSize:13}} onClick={()=>{setExpDraft(vr.licenseExp||''); setEditingExp(true);}}>Edit</button>
          </>
        ) : (
          <>
            <input type="date" value={expDraft} onChange={e=>setExpDraft(e.target.value)} style={{width:'auto',padding:8}} />
            <button className="link-btn" style={{padding:0,fontSize:13}} onClick={()=>{onUpdateExp(driverUser.id, expDraft); setEditingExp(false);}}>Save</button>
            <button className="link-btn" style={{padding:0,fontSize:13,color:'var(--muted)'}} onClick={()=>setEditingExp(false)}>Cancel</button>
          </>
        )}
      </div>
      <div className="muted">
        License check: <strong style={{color: vr.licenseVerifiedInPerson ? 'var(--safe)' : 'var(--danger)'}}>
          {vr.licenseVerifiedInPerson ? 'Verified in person ✓' : 'Not yet verified in person'}
        </strong>
      </div>
      <div className="muted">At-fault accidents (3yr): {vr.atFaultAccidents3yr ? (vr.atFaultAccidentsDetails||'Yes') : 'None reported'}</div>
      <div className="muted">Moving violations (3yr): {vr.movingViolations3yr ? (vr.movingViolationsDetails||'Yes') : 'None reported'}</div>
      <div className="muted">Insurance cancelled/refused: {vr.insuranceCancelled ? <strong style={{color:'var(--danger)'}}>YES</strong> : 'No'}</div>
      <div className="muted">License revoked/suspended/restricted: {vr.licenseRevokedSuspended ? <strong style={{color:'var(--danger)'}}>YES</strong> : 'No'}</div>
      <div style={{display:'flex',gap:8,marginTop:8,flexWrap:'wrap'}}>
        {needsVerify && <button className="secondary" style={{marginTop:0}} onClick={()=>onVerify(driverUser.id)}>Mark license verified in person</button>}
        <button className="primary" style={{marginTop:0}} disabled={needsVerify} onClick={()=>onApprove(driverUser.id)}>Approve</button>
        <button className="secondary" style={{marginTop:0}} onClick={()=>onDeny(driverUser.id)}>Deny</button>
      </div>
    </div>
  );
}

function SafetyBlockAlertCard({alert,driver,van,rental,onResolveAlert}){
  const draft = rental.checkoutDraft || {};
  const [completing,setCompleting] = useState(false);
  const [clean,setClean] = useState(null);
  const [cleanPhoto,setCleanPhoto] = useState(null);
  const [cleanUploading,setCleanUploading] = useState(false);
  const [saving,setSaving] = useState(false);

  async function clearForDriver(){
    setSaving(true);
    await db.collection('vanRentals').doc(rental.id).update({
      checkoutCleared: true,
      clearedBy: currentUserUid(), clearedAt: Date.now(),
    });
    await onResolveAlert(alert.id);
    setSaving(false);
  }

  async function handlePhoto(file){
    setCleanUploading(true);
    const url = await uploadPhoto(file, `vanRentalPhotos/${rental.id}/${uid()}.jpg`);
    setCleanPhoto(url);
    setCleanUploading(false);
  }

  async function completeAsAdmin(){
    setSaving(true);
    await db.collection('vanRentals').doc(rental.id).update({
      checkout: {
        mileage: draft.mileage, gas: draft.gas, dashPhoto: draft.dashPhoto,
        warningLightsOn: draft.checkedLights || [],
        otherLightReported: draft.otherLightChecked||false, otherLightDesc: draft.otherLightDesc||'',
        clean, cleanPhoto, at: Date.now(), completedByAdmin: true,
      },
      checkoutDraft: firebase.firestore.FieldValue.delete(),
      checkoutBlocked: false, checkoutCleared: false,
    });
    await db.collection('vans').doc(van.id).update({
      mileage: Number(draft.mileage)||van.mileage, gas: draft.gas,
    });
    await onResolveAlert(alert.id);
    setSaving(false);
  }

  return (
    <div className="list-item" style={{flexDirection:'column',alignItems:'stretch'}}>
      <div><strong>{driver?.name||'Unknown driver'}</strong> on {van?.name}</div>
      <div className="muted">"{alert.description}"</div>
      <div className="muted" style={{marginTop:6}}>Recorded so far — Mileage: {draft.mileage||'—'} · Gas: {draft.gas ?? '—'}%</div>
      {draft.dashPhoto && <img src={draft.dashPhoto} alt="dashboard" style={{maxWidth:'100%',borderRadius:8,marginTop:8}} />}

      {!completing && (
        <div style={{display:'flex',gap:8,marginTop:10,flexWrap:'wrap'}}>
          <button className="secondary" style={{marginTop:0}} disabled={saving} onClick={clearForDriver}>
            {saving ? 'Clearing...' : 'Clear — let driver finish'}
          </button>
          <button className="secondary" style={{marginTop:0}} onClick={()=>setCompleting(true)}>Complete checkout myself</button>
        </div>
      )}

      {completing && (
        <div style={{marginTop:14, paddingTop:14, borderTop:'1px solid var(--border)'}}>
          <p className="muted">Finish the last step (cleanliness) on the driver's behalf to complete this checkout now.</p>
          <label>Is the van clean?</label>
          <YesNo value={clean} onChange={setClean} />
          <CameraCapture label="Take a photo of the van interior" photoUrl={cleanPhoto} uploading={cleanUploading} onCapture={handlePhoto} />
          <button className="primary" disabled={clean===null || !cleanPhoto || saving} onClick={completeAsAdmin}>
            {saving ? 'Completing...' : 'Complete Checkout'}
          </button>
          <button className="link-btn" onClick={()=>setCompleting(false)}>Cancel</button>
        </div>
      )}
    </div>
  );
}
function currentUserUid(){ return auth.currentUser ? auth.currentUser.uid : null; }

function AdminDashboard({allUsers,vans,rentals,warningLights,maintenanceNotes,repairLog,alerts,recurringRequests}){
  const [tab,setTab] = useState('approvals');
  const driverUsers = allUsers.filter(u=>u.vanRentalProfile);
  const pending = driverUsers.filter(u=>u.vanRentalProfile.status==='pending');
  const approved = driverUsers.filter(u=>u.vanRentalProfile.status==='approved');
  const openAlerts = alerts.filter(a=>!a.resolved);
  const recurringPendingCount = recurringRequests.filter(r=>r.status==='pending'||r.status==='renewal_requested').length;

  async function approve(uid_){ await db.collection('users').doc(uid_).update({'vanRentalProfile.status':'approved'}); }
  async function deny(uid_){ await db.collection('users').doc(uid_).update({'vanRentalProfile.status':'denied'}); }

  // Generates individual weekly vanRentals docs across a 3-month
  // window for an approved recurring request, checking each week for
  // van conflicts the same way a one-time request does.
  async function approveRecurring(reqId){
    const req = recurringRequests.find(r=>r.id===reqId);
    if(!req) return;
    const activeRentals = rentals.filter(r=>r.status!=='completed' && r.status!=='cancelled');
    const start = new Date(req.windowStart+'T00:00:00');
    const end = new Date(req.windowEnd+'T00:00:00');
    let cursor = new Date(start);
    // Move cursor to the first matching day-of-week on or after windowStart
    while(cursor.getDay() !== Number(req.dayOfWeek)) cursor.setDate(cursor.getDate()+1);

    const createdDates = [];
    const skippedDates = [];
    while(cursor <= end){
      const dateStr = cursor.toISOString().split('T')[0];
      const slotStart = new Date(`${dateStr}T${req.time}`);
      const slotEnd = new Date(`${dateStr}T${req.endTime}`);
      const conflictVanIds = new Set(
        activeRentals.filter(r=>{
          if(!r.date || !r.time) return false;
          const rStart = new Date(`${r.date}T${r.time}`);
          const rEnd = r.endDate && r.endTime ? new Date(`${r.endDate}T${r.endTime}`) : new Date(rStart.getTime()+4*60*60*1000);
          return rentalOverlaps(slotStart,slotEnd,rStart,rEnd);
        }).map(r=>r.vanId)
      );
      const available = vans.filter(v=>v.status!=='maintenance' && !conflictVanIds.has(v.id));
      if(available.length>0){
        const van = [...available].sort((a,b)=>{
          if(!!a.lowPriority !== !!b.lowPriority) return a.lowPriority ? 1 : -1;
          return a.mileage-b.mileage;
        })[0];
        await db.collection('vanRentals').add({
          driverId: req.driverId, vanId: van.id, date: dateStr, time: req.time,
          endDate: dateStr, endTime: req.endTime, purpose: req.purpose,
          status:'assigned', createdAt: Date.now(), recurringRequestId: reqId,
        });
        createdDates.push(dateStr);
      } else {
        skippedDates.push(dateStr);
      }
      cursor.setDate(cursor.getDate()+7);
    }

    await db.collection('vanRecurringRequests').doc(reqId).update({
      status:'active', approvedAt: Date.now(),
      lastGeneratedDates: createdDates, skippedDates,
    });
  }

  async function denyRecurring(reqId){
    await db.collection('vanRecurringRequests').doc(reqId).update({status:'denied'});
  }

  async function endRecurring(reqId){
    if(!confirm('End this recurring reservation? Already-scheduled weeks stay on the calendar, but no new weeks will be generated.')) return;
    await db.collection('vanRecurringRequests').doc(reqId).update({status:'ended', endedAt: Date.now()});
  }

  // Approving a renewal extends the window another 3 months and
  // generates the next batch of weekly slots, same conflict-checking
  // as the initial approval.
  async function approveRenewal(reqId){
    const req = recurringRequests.find(r=>r.id===reqId);
    if(!req) return;
    const newWindowStart = req.windowEnd;
    const d = new Date(newWindowStart+'T00:00:00');
    d.setMonth(d.getMonth()+3);
    const newWindowEnd = d.toISOString().split('T')[0];
    await db.collection('vanRecurringRequests').doc(reqId).update({
      windowStart: newWindowStart, windowEnd: newWindowEnd, status:'pending', renewalRequestedAt: null,
    });
    // Re-run the same generation logic against the new window.
    await approveRecurring(reqId);
  }
  async function verifyLicenseInPerson(uid_){ await db.collection('users').doc(uid_).update({'vanRentalProfile.licenseVerifiedInPerson':true}); }
  async function updateLicenseExp(uid_, newExp){ await db.collection('users').doc(uid_).update({'vanRentalProfile.licenseExp':newExp}); }
  async function resolveAlert(id){ await db.collection('vanAlerts').doc(id).update({resolved:true}); }
  async function addWarningLight(name,safety,feedback,vanId){
    await db.collection('vanWarningLights').add({name,safety,feedback: safety? null : feedback, van: vanId||null});
  }
  async function resolveMaint(id){ await db.collection('vanMaintenanceNotes').doc(id).update({resolved:true}); }
  async function setVanStatus(vanId,status){ await db.collection('vans').doc(vanId).update({status}); }
  async function addVan(name, isBorrowed, borrowedFrom, returnDate){
    await db.collection('vans').add({
      name, mileage:0, gas:100, status:'available', lowPriority:false,
      borrowed: isBorrowed, borrowedFrom: isBorrowed ? borrowedFrom : null,
      expectedReturnDate: isBorrowed ? returnDate : null,
    });
  }
  async function removeVan(vanId){
    if(!confirm('Remove this van from the system? This does not delete its rental history.')) return;
    await db.collection('vans').doc(vanId).delete();
  }
  async function addRepair(vanId,date,serviceType,notes,performedBy){
    await db.collection('vanRepairLog').add({vanId,date,serviceType,notes,performedBy,createdAt:Date.now()});
  }
  async function addManualReservation({vanId,driverId,date,time,endDate,endTime,purpose}){
    await db.collection('vanRentals').add({
      driverId: driverId||null, vanId, date, time, endDate, endTime, purpose,
      status:'assigned', createdAt:Date.now(), createdByAdmin:true,
    });
    const van = vans.find(v=>v.id===vanId);
    if(van && van.status!=='maintenance') await db.collection('vans').doc(vanId).update({status:'inuse'});
  }
  async function cancelReservation(rentalId){
    const rental = rentals.find(r=>r.id===rentalId);
    if(!rental) return;
    await db.collection('vanRentals').doc(rentalId).update({status:'cancelled'});
    const otherActive = rentals.some(r=>r.id!==rentalId && r.vanId===rental.vanId && r.status!=='completed' && r.status!=='cancelled' && r.checkout && !r.return);
    const van = vans.find(v=>v.id===rental.vanId);
    if(van && van.status!=='maintenance' && !otherActive){ await db.collection('vans').doc(rental.vanId).update({status:'available'}); }
  }

  // Lets an admin complete a checkout on a driver's behalf, without
  // requiring the dashboard photo/gauge steps a driver would normally
  // go through in person — useful when the admin is handing off keys
  // directly and wants to record mileage/gas themselves. Writes data
  // compatible with the same checkout shape the driver flow uses, so
  // History and other views don't need special-casing, but flags
  // completedByAdmin so it's clear this wasn't the driver's own
  // in-person confirmation.
  async function manualCheckout(rentalId, {mileage, gas}){
    const rental = rentals.find(r=>r.id===rentalId);
    if(!rental) return;
    const van = vans.find(v=>v.id===rental.vanId);
    await db.collection('vanRentals').doc(rentalId).update({
      checkout: {
        mileage, gas, dashPhoto: null, warningLightsOn: [],
        otherLightReported: false, otherLightDesc: '',
        clean: null, cleanPhoto: null, at: Date.now(),
        completedByAdmin: true, completedByAdminUid: currentUserUid(),
      },
    });
    if(van){
      await db.collection('vans').doc(van.id).update({
        mileage: Number(mileage)||van.mileage, gas: Number(gas)||van.gas, status:'inuse',
      });
    }
  }

  // Same idea for completing a return/check-in manually — this is
  // functionally identical to any approved driver checking in someone
  // else's van (which is already allowed), just surfaced here as a
  // dedicated admin action for convenience.
  async function manualCheckin(rentalId, {mileage, gas, problems, problemDetails}){
    const rental = rentals.find(r=>r.id===rentalId);
    if(!rental) return;
    const van = vans.find(v=>v.id===rental.vanId);
    await db.collection('vanRentals').doc(rentalId).update({
      status:'completed',
      return: {
        mileage, gas, clean: null, cleanPhoto: null,
        warningLightsOn: [], otherLightReported: false, otherLightDesc: '',
        completedBy: currentUserUid(), completedByAdmin: true,
        problems, problemDetails, at: Date.now(),
      },
    });
    if(van){
      await db.collection('vans').doc(van.id).update({
        mileage: Number(mileage)||van.mileage, gas: Number(gas)||van.gas, status:'available',
      });
    }
    if(problems && problemDetails){
      await db.collection('vanMaintenanceNotes').add({
        vanId: rental.vanId, note: problemDetails, reportedBy: rental.driverId, rentalId,
        createdAt: Date.now(), resolved: false,
      });
    }
  }

  // Lets an admin pick a driver + a specific van directly and check
  // it out right away, without a pre-existing reservation. Creates
  // the vanRentals record and completes checkout in one motion.
  // Still checks for conflicts against the van's other active
  // rentals for today, so this can't silently double-book a van
  // that's already out or reserved for right now.
  async function assignVanDirectly(driverId, vanId, {mileage, gas, purpose}){
    const van = vans.find(v=>v.id===vanId);
    if(!van) return {error: 'Van not found.'};
    if(van.status==='maintenance') return {error: 'That van is currently in maintenance.'};

    const now = new Date();
    const dateStr = now.toISOString().split('T')[0];
    const timeStr = now.toTimeString().slice(0,5);
    const nowTime = now.getTime();

    const conflict = rentals.some(r=>{
      if(r.vanId!==vanId || r.status==='completed' || r.status==='cancelled') return false;
      if(!r.checkout) return false; // not out yet, no conflict with a fresh checkout
      if(r.return) return false; // already back
      return true; // van is currently checked out to someone else
    });
    if(conflict) return {error: 'That van is currently checked out to someone else.'};

    const rentalRef = db.collection('vanRentals').doc();
    await rentalRef.set({
      driverId, vanId, date: dateStr, time: timeStr, endDate: dateStr, endTime: timeStr,
      purpose: purpose || '', status: 'assigned', createdAt: Date.now(), createdByAdmin: true,
      checkout: {
        mileage, gas, dashPhoto: null, warningLightsOn: [],
        otherLightReported: false, otherLightDesc: '',
        clean: null, cleanPhoto: null, at: Date.now(),
        completedByAdmin: true, completedByAdminUid: currentUserUid(),
      },
    });
    await db.collection('vans').doc(vanId).update({
      mileage: Number(mileage)||van.mileage, gas: Number(gas)||van.gas, status:'inuse',
    });
    return {success: true};
  }

  // Reassigns an in-progress rental to a new driver, a new van, or
  // both — closes out the current rental as "reassigned" (distinct
  // from a normal completed return, so History can tell the
  // difference) and opens a fresh rental for the new driver/van,
  // carrying over the handoff mileage/gas as the new leg's starting
  // point. Two linked records instead of editing one in place, so
  // the trail of who actually had the van and when stays honest.
  async function reassignVan(oldRentalId, {newDriverId, newVanId, mileage, gas, purpose}){
    const oldRental = rentals.find(r=>r.id===oldRentalId);
    if(!oldRental) return {error: 'Original rental not found.'};
    const targetVanId = newVanId || oldRental.vanId;
    const targetDriverId = newDriverId || oldRental.driverId;
    const newVan = vans.find(v=>v.id===targetVanId);
    if(!newVan) return {error: 'Van not found.'};
    if(newVanId && newVanId!==oldRental.vanId && newVan.status==='maintenance'){
      return {error: 'That van is currently in maintenance.'};
    }

    // Only check for conflicts if switching to a genuinely different
    // van — reassigning the same van to a new driver can't conflict
    // with itself.
    if(newVanId && newVanId!==oldRental.vanId){
      const conflict = rentals.some(r=>{
        if(r.id===oldRentalId || r.vanId!==newVanId || r.status==='completed' || r.status==='cancelled') return false;
        if(!r.checkout || r.return) return false;
        return true;
      });
      if(conflict) return {error: 'That van is currently checked out to someone else.'};
    }

    const oldVan = vans.find(v=>v.id===oldRental.vanId);

    // Close out the old rental as reassigned, not a normal return.
    await db.collection('vanRentals').doc(oldRentalId).update({
      status: 'completed',
      return: {
        mileage, gas, clean: null, cleanPhoto: null,
        warningLightsOn: [], otherLightReported: false, otherLightDesc: '',
        completedBy: currentUserUid(), completedByAdmin: true,
        reassigned: true, reassignedTo: {driverId: targetDriverId, vanId: targetVanId},
        at: Date.now(),
      },
    });

    // If the van itself is changing, the old van goes back to
    // available (assuming nothing else has it out already).
    if(oldVan && newVanId && newVanId!==oldRental.vanId){
      await db.collection('vans').doc(oldVan.id).update({status:'available'});
    }

    // Open the new leg.
    const now = new Date();
    const dateStr = now.toISOString().split('T')[0];
    const timeStr = now.toTimeString().slice(0,5);
    const newRentalRef = db.collection('vanRentals').doc();
    await newRentalRef.set({
      driverId: targetDriverId, vanId: targetVanId, date: dateStr, time: timeStr,
      endDate: dateStr, endTime: timeStr, purpose: purpose || oldRental.purpose || '',
      status: 'assigned', createdAt: Date.now(), createdByAdmin: true,
      reassignedFrom: oldRentalId,
      checkout: {
        mileage, gas, dashPhoto: null, warningLightsOn: [],
        otherLightReported: false, otherLightDesc: '',
        clean: null, cleanPhoto: null, at: Date.now(),
        completedByAdmin: true, completedByAdminUid: currentUserUid(),
      },
    });
    await db.collection('vans').doc(targetVanId).update({
      mileage: Number(mileage)||newVan.mileage, gas: Number(gas)||newVan.gas, status:'inuse',
    });

    return {success: true};
  }

  return (
    <div className="content">
      <div className="nav-tabs">
        <button className={tab==='approvals'?'active':''} onClick={()=>setTab('approvals')}>Drivers</button>
        <button className={tab==='adddriver'?'active':''} onClick={()=>setTab('adddriver')}>Add Driver</button>
        <button className={tab==='vans'?'active':''} onClick={()=>setTab('vans')}>Vans</button>
        <button className={tab==='checkinout'?'active':''} onClick={()=>setTab('checkinout')}>Check In/Out</button>
        <button className={tab==='schedule'?'active':''} onClick={()=>setTab('schedule')}>Schedule</button>
        <button className={tab==='history'?'active':''} onClick={()=>setTab('history')}>History</button>
        <button className={tab==='recurring'?'active':''} onClick={()=>setTab('recurring')}>Recurring{recurringPendingCount>0?` (${recurringPendingCount})`:''}</button>
        <button className={tab==='team'?'active':''} onClick={()=>setTab('team')}>Team</button>
        <button className={tab==='repairs'?'active':''} onClick={()=>setTab('repairs')}>Repairs</button>
        <button className={tab==='lights'?'active':''} onClick={()=>setTab('lights')}>Lights</button>
        <button className={tab==='alerts'?'active':''} onClick={()=>setTab('alerts')}>Alerts{openAlerts.length>0?` (${openAlerts.length})`:''}</button>
        <button className={tab==='maint'?'active':''} onClick={()=>setTab('maint')}>Maint.</button>
      </div>

      {tab==='approvals' && (
        <div className="card">
          <h3>Pending Applications</h3>
          {pending.length===0 && <p className="muted">None pending.</p>}
          {pending.map(u=>(
            <PendingDriverCard key={u.id} driverUser={u} onApprove={approve} onDeny={deny} onVerify={verifyLicenseInPerson} onUpdateExp={updateLicenseExp} />
          ))}
          <h3 style={{marginTop:20}}>Approved Drivers</h3>
          {approved.map(u=>{
            const vr = u.vanRentalProfile;
            const flags = [];
            if(vr.atFaultAccidents1yr) flags.push('at-fault accident');
            if(vr.movingViolations1yr) flags.push('moving violation');
            if(vr.licenseRevokedSuspended) flags.push('license revoked/suspended');
            return (
              <div key={u.id} className="list-item" style={{flexDirection:'column',alignItems:'stretch'}}>
                <div style={{display:'flex',justifyContent:'space-between'}}>
                  <div>{u.name}</div><span className="badge approved">approved</span>
                </div>
                {vr.lastRenewed && <div className="muted">Last renewed: {new Date(vr.lastRenewed).toLocaleDateString()}</div>}
                {flags.length>0 && <div className="muted" style={{color:'var(--danger)',fontWeight:600}}>Flagged at renewal: {flags.join(', ')}</div>}
              </div>
            );
          })}
        </div>
      )}

      {tab==='adddriver' && <AdminAddDriver />}

      {tab==='vans' && (
        <div className="card">
          <h3>Vans</h3>
          {vans.map(v=>(
            <VanDetailCard
              key={v.id}
              van={v}
              maintenanceNotes={maintenanceNotes.filter(m=>m.vanId===v.id)}
              repairLog={repairLog.filter(r=>r.vanId===v.id)}
              onSetStatus={setVanStatus}
              onRemove={removeVan}
              onResolveMaint={resolveMaint}
            />
          ))}
          <AddVanForm onAdd={addVan} />
        </div>
      )}

      {tab==='checkinout' && <ManualCheckInOut vans={vans} rentals={rentals} approvedDrivers={approved} onCheckout={manualCheckout} onCheckin={manualCheckin} onAssignDirectly={assignVanDirectly} onReassign={reassignVan} />}

      {tab==='schedule' && <ScheduleAdmin vans={vans} approvedDrivers={approved} rentals={rentals} onAdd={addManualReservation} onCancel={cancelReservation} />}
      {tab==='history' && <RentalHistoryAdmin vans={vans} rentals={rentals} allUsers={allUsers} />}
      {tab==='recurring' && <RecurringAdmin recurringRequests={recurringRequests} allUsers={allUsers} onApprove={approveRecurring} onDeny={denyRecurring} onEnd={endRecurring} onApproveRenewal={approveRenewal} />}
      {tab==='team' && <VanTeamAdmin allUsers={allUsers} />}
      {tab==='repairs' && <RepairsAdmin vans={vans} repairLog={repairLog} onAdd={addRepair} />}
      {tab==='lights' && <WarningLightsAdmin vans={vans} warningLights={warningLights} onAdd={addWarningLight} />}

      {tab==='alerts' && (
        <div className="card">
          <h3>Safety Alerts</h3>
          {openAlerts.length===0 && <p className="muted">No open alerts.</p>}
          {openAlerts.map(a=>{
            const driver = allUsers.find(u=>u.id===a.driverId);
            const van = vans.find(v=>v.id===a.vanId);
            const rental = a.rentalId ? rentals.find(r=>r.id===a.rentalId) : null;
            const isCheckoutBlock = a.type==='safety_light_block' && rental && rental.checkoutBlocked && !rental.checkoutCleared;

            if(isCheckoutBlock){
              return <SafetyBlockAlertCard key={a.id} alert={a} driver={driver} van={van} rental={rental} onResolveAlert={resolveAlert} />;
            }
            return (
              <div key={a.id} className="list-item" style={{flexDirection:'column',alignItems:'stretch'}}>
                <div><strong>{driver?.name||'Unknown driver'}</strong> on {van?.name}</div>
                <div className="muted">"{a.description}"</div>
                <button className="secondary" style={{marginTop:8}} onClick={()=>resolveAlert(a.id)}>Mark Resolved</button>
              </div>
            );
          })}
        </div>
      )}

      {tab==='maint' && (
        <div className="card">
          <h3>Maintenance Notes</h3>
          {maintenanceNotes.length===0 && <p className="muted">No notes.</p>}
          {maintenanceNotes.slice().reverse().map(m=>{
            const van = vans.find(v=>v.id===m.vanId);
            return (
              <div key={m.id} className="list-item" style={{flexDirection:'column',alignItems:'stretch',opacity:m.resolved?0.5:1}}>
                <div><strong>{van?.name}</strong></div>
                <div className="muted">{m.note}</div>
                {!m.resolved && <button className="secondary" style={{marginTop:8}} onClick={()=>resolveMaint(m.id)}>Mark Resolved</button>}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function VanTeamAdmin({allUsers}){
  const [search,setSearch] = useState('');
  const vanAdmins = allUsers.filter(u => u.roles && u.roles.vanAdmin === true);
  const others = allUsers.filter(u => !(u.roles && u.roles.vanAdmin === true))
    .filter(u => search && ((u.name||'').toLowerCase().includes(search.toLowerCase()) || (u.email||'').toLowerCase().includes(search.toLowerCase())));

  async function grant(uid_){
    await db.collection('users').doc(uid_).set({roles:{vanAdmin:true}}, {merge:true});
  }
  async function revoke(uid_){
    if(!confirm('Remove Van Usage admin access for this person?')) return;
    await db.collection('users').doc(uid_).set({roles:{vanAdmin:false}}, {merge:true});
  }

  return (
    <div className="card">
      <h3>Van Usage Admins</h3>
      <p className="muted">People with this role can approve drivers, manage vans, and handle scheduling — but nothing outside Van Usage (no Bedside, Graphics, Marketing, or other apps).</p>
      {vanAdmins.length===0 && <p className="muted">No one else has this yet.</p>}
      {vanAdmins.map(u=>(
        <div key={u.id} className="list-item">
          <div><div>{u.name||u.email}</div><div className="muted">{u.email}</div></div>
          <button className="secondary" style={{marginTop:0,width:'auto',padding:'8px 14px'}} onClick={()=>revoke(u.id)}>Remove</button>
        </div>
      ))}

      <h3 style={{marginTop:24}}>Add Someone</h3>
      <p className="muted">Search by name or email among people who've already signed into the hub at least once.</p>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name or email..." />
      {search && others.length===0 && <p className="muted" style={{marginTop:10}}>No matches. They need to sign into the hub at least once first.</p>}
      {others.map(u=>(
        <div key={u.id} className="list-item">
          <div><div>{u.name||u.email}</div><div className="muted">{u.email}</div></div>
          <button className="secondary" style={{marginTop:0,width:'auto',padding:'8px 14px'}} onClick={()=>grant(u.id)}>Make Van Admin</button>
        </div>
      ))}
    </div>
  );
}

function RecurringAdmin({recurringRequests,allUsers,onApprove,onDeny,onEnd,onApproveRenewal}){
  function nameFor(uid_){
    const u = allUsers.find(u=>u.id===uid_);
    return u?.name || u?.email || 'Unknown';

  const pendingNew = recurringRequests.filter(r=>r.status==='pending');
  const renewals = recurringRequests.filter(r=>r.status==='renewal_requested');

  return (
    <div className="card">
      <h3>Renewal Requests</h3>
      <p className="muted">These are already active but the driver has asked to continue for another 3 months.</p>
      {renewals.length===0 && <p className="muted">None right now.</p>}
      {renewals.map(r=>(
        <div key={r.id} className="list-item" style={{flexDirection:'column',alignItems:'stretch'}}>
          <div><strong>{nameFor(r.driverId)}</strong> — {DAY_NAMES[r.dayOfWeek]}s, {r.time}–{r.endTime}</div>

          <div style={{display:'flex',gap:8,marginTop:8}}>

      {pendingNew.length===0 && <p className="muted">None pending.</p>}
      {pendingNew.map(r=>(
        <div key={r.id} className="list-item" style={{flexDirection:'column',alignItems:'stretch'}}>
          <div><strong>{nameFor(r.driverId)}</strong> — {DAY_NAMES[r.dayOfWeek]}s, {r.time}–{r.endTime}</div>
          <div className="muted">Requested window: {r.windowStart} → {r.windowEnd}. Purpose: {r.purpose||'—'}</div>
          <div style={{display:'flex',gap:8,marginTop:8}}>
            <button className="primary" style={{marginTop:0}} onClick={()=>onApprove(r.id)}>Approve — Schedule 3 Months</button>
            <button className="secondary" style={{marginTop:0}} onClick={()=>onDeny(r.id)}>Deny</button>
          </div>
        </div>
      ))}

      <h3 style={{marginTop:24}}>Active Recurring Reservations</h3>
      {active.length===0 && <p className="muted">None active.</p>}
      {active.map(r=>{
        const skipped = r.skippedDates || [];
        return (
          <div key={r.id} className="list-item" style={{flexDirection:'column',alignItems:'stretch'}}>
            <div><strong>{nameFor(r.driverId)}</strong> — {DAY_NAMES[r.dayOfWeek]}s, {r.time}–{r.endTime}</div>
            <div className="muted">Window: {r.windowStart} → {r.windowEnd}</div>
            {skipped.length>0 && <div className="muted" style={{color:'var(--danger)'}}>Couldn't find a van for: {skipped.join(', ')}</div>}

function ManualCheckInOut({vans,rentals,approvedDrivers,onCheckout,onCheckin,onAssignDirectly,onReassign}){

  const availableVans = vans.filter(v=>v.status!=='maintenance');

function DirectAssignForm({vans,approvedDrivers,onAssign}){
  const [driverId,setDriverId] = useState('');
  const [vanId,setVanId] = useState('');
  const [mileage,setMileage] = useState('');
  const [gas,setGas] = useState('');
  const [purpose,setPurpose] = useState('');
  const [saving,setSaving] = useState(false);
  const [error,setError] = useState('');

  const selectedVan = vans.find(v=>v.id===vanId);
  const canSubmit = driverId && vanId && mileage && gas && !saving;

  async function submit(){
    setError(''); setSaving(true);
    const result = await onAssign(driverId, vanId, {mileage, gas, purpose});
    setSaving(false);
    if(result?.error){ setError(result.error); return; }
    setDriverId(''); setVanId(''); setMileage(''); setGas(''); setPurpose('');
  }

  return (
    <div style={{border:'1px solid var(--border)', borderRadius:10, padding:14, marginTop:10}}>
      <label>Driver</label>
      <select value={driverId} onChange={e=>setDriverId(e.target.value)}>
        <option value="">Select a driver...</option>
        {approvedDrivers.map(d=><option key={d.id} value={d.id}>{d.name||d.email}</option>)}
      </select>
      <label>Van</label>
      <select value={vanId} onChange={e=>setVanId(e.target.value)}>
        <option value="">Select a van...</option>
        {vans.map(v=><option key={v.id} value={v.id}>{v.name} ({v.status})</option>)}
      </select>
      <label>Mileage</label>
      <input type="number" value={mileage} onChange={e=>setMileage(e.target.value)} placeholder={selectedVan ? `Last known: ${selectedVan.mileage}` : 'Mileage'} />
      <label>Gas %</label>
      <input type="number" min="0" max="100" value={gas} onChange={e=>setGas(e.target.value)} />
      <label>Purpose (optional)</label>
      <input type="text" value={purpose} onChange={e=>setPurpose(e.target.value)} placeholder="e.g. Youth group errand" />
      {error && <div className="banner-danger">{error}</div>}
      <button className="primary" disabled={!canSubmit} onClick={submit}>{saving?'Assigning...':'Assign & Check Out'}</button>
    </div>
  );
}

function ScheduleAdmin({vans,approvedDrivers,rentals,onAdd,onCancel}){
  const [vanId,setVanId] = useState(vans[0]?.id||'');
  const [driverId,setDriverId] = useState('');
  const [date,setDate] = useState('');
  const [time,setTime] = useState('');
  const [endDate,setEndDate] = useState('');
  const [endTime,setEndTime] = useState('');
  const [purpose,setPurpose] = useState('');
  const [error,setError] = useState('');
  const activeRentals = rentals.filter(r=>r.status!=='completed' && r.status!=='cancelled');

  async function submit(){
    setError('');
    if(!vanId || !date || !time || !endDate || !endTime){ setError('Fill in van, start, and end.'); return; }
    const start = new Date(`${date}T${time}`);
    const end = new Date(`${endDate}T${endTime}`);
    if(!(start < end)){ setError('End date/time must be after start date/time.'); return; }
    const conflict = activeRentals.some(r=>{
      if(r.vanId!==vanId || !r.date || !r.time) return false;
      const rStart = new Date(`${r.date}T${r.time}`);
      const rEnd = r.endDate && r.endTime ? new Date(`${r.endDate}T${r.endTime}`) : new Date(rStart.getTime()+4*60*60*1000);
      return start < rEnd && rStart < end;
    });
    if(conflict){ setError('That van already has an overlapping reservation for this window.'); return; }
    await onAdd({vanId,driverId:driverId||null,date,time,endDate,endTime,purpose});
    setDate('');setTime('');setEndDate('');setEndTime('');setPurpose('');setDriverId('');
  }

  const upcoming = activeRentals.slice().sort((a,b)=> new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));

  return (
    <div className="card">
      <h3>Upcoming Reservations</h3>
      {upcoming.length===0 && <p className="muted">Nothing scheduled.</p>}
      {upcoming.map(r=>{
        const van = vans.find(v=>v.id===r.vanId);
        const driver = approvedDrivers.find(d=>d.id===r.driverId);
        return (
          <div key={r.id} className="list-item" style={{flexDirection:'column',alignItems:'stretch'}}>
            <div><strong>{van?.name}</strong> {r.createdByAdmin && <span className="badge admin">admin-scheduled</span>}</div>
            <div className="muted">{driver ? driver.name : (r.purpose||'No driver linked')}</div>
            <div className="muted">{r.date} {r.time} → {r.endDate} {r.endTime}</div>
            <button className="secondary" style={{marginTop:8}} onClick={()=>onCancel(r.id)}>Cancel Reservation</button>
          </div>
        );
      })}

      <h3 style={{marginTop:24}}>Add a Reservation / Block Dates</h3>
      <p className="muted">Use this to book a van on someone's behalf, or to block a van out (e.g. for maintenance) so it won't be auto-assigned during that window.</p>
      <label>Van</label>
      <select value={vanId} onChange={e=>setVanId(e.target.value)}>{vans.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}</select>
      <label>Driver (optional — leave blank to just block the dates)</label>
      <select value={driverId} onChange={e=>setDriverId(e.target.value)}>
        <option value="">No driver / blackout dates</option>
        {approvedDrivers.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
      </select>
      <label>Start Date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)} />
      <label>Start Time</label><input type="time" value={time} onChange={e=>setTime(e.target.value)} />
      <label>End Date</label><input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} />
      <label>End Time</label><input type="time" value={endTime} onChange={e=>setEndTime(e.target.value)} />
      <label>Purpose / Notes (optional)</label><input value={purpose} onChange={e=>setPurpose(e.target.value)} placeholder="e.g. Oil change appointment" />
      {error && <div className="banner-danger">{error}</div>}
      <button className="primary" onClick={submit}>Add to Schedule</button>
    </div>
  );
}

function RepairsAdmin({vans,repairLog,onAdd}){
  const [vanId,setVanId] = useState(vans[0]?.id||'');
  const [date,setDate] = useState('');
  const [serviceType,setServiceType] = useState('');
  const [customType,setCustomType] = useState('');
  const [notes,setNotes] = useState('');
  const [performedBy,setPerformedBy] = useState('');
  const commonTypes = ['Oil Change','Tire Rotation','Check Engine Light Diagnosis','Brake Service','Battery Replacement','Inspection','Other'];

  async function submit(){
    const type = serviceType==='Other' ? customType : serviceType;
    await onAdd(vanId,date,type,notes,performedBy);
    setDate('');setServiceType('');setCustomType('');setNotes('');setPerformedBy('');
  }
  const canSubmit = vanId && date && (serviceType && (serviceType!=='Other' || customType));
  const sorted = repairLog.slice().sort((a,b)=>b.createdAt-a.createdAt);

  return (
    <div className="card">
      <h3>Repair History</h3>
      {sorted.length===0 && <p className="muted">No repair records yet.</p>}
      {sorted.map(r=>{
        const van = vans.find(v=>v.id===r.vanId);
        return (
          <div key={r.id} className="list-item" style={{flexDirection:'column',alignItems:'stretch'}}>
            <div><strong>{van?.name}</strong> — {r.date}</div>
            <div className="muted">{r.serviceType}{r.performedBy ? ` · by ${r.performedBy}` : ''}</div>
            {r.notes && <div className="muted">{r.notes}</div>}
          </div>
        );
      })}
      <h3 style={{marginTop:20}}>Log a Repair</h3>
      <label>Van</label>
      <select value={vanId} onChange={e=>setVanId(e.target.value)}>{vans.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}</select>
      <label>Date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)} />
      <label>What was done?</label>
      <select value={serviceType} onChange={e=>setServiceType(e.target.value)}>
        <option value="">Select...</option>
        {commonTypes.map(t=><option key={t} value={t}>{t}</option>)}
      </select>
      {serviceType==='Other' && (<><label>Describe the service</label><input value={customType} onChange={e=>setCustomType(e.target.value)} /></>)}
      <label>Notes (optional)</label><textarea value={notes} onChange={e=>setNotes(e.target.value)} />
      <label>Performed By (optional)</label><input value={performedBy} onChange={e=>setPerformedBy(e.target.value)} placeholder="Shop name or staff member" />
      <button className="primary" disabled={!canSubmit} onClick={submit}>Add Repair Record</button>
    </div>
  );
}

function WarningLightsAdmin({vans,warningLights,onAdd}){
  const [name,setName] = useState('');
  const [safety,setSafety] = useState(false);
  const [feedback,setFeedback] = useState('');
  const [vanId,setVanId] = useState('');
  return (
    <div className="card">
      <h3>Known Warning Lights</h3>
      {warningLights.map(l=>(
        <div key={l.id} className="list-item">
          <div><div>{l.name}</div>{l.van && <div className="muted">Van-specific</div>}</div>
          <span className={`badge ${l.safety?'maintenance':'available'}`}>{l.safety?'safety':'non-safety'}</span>
        </div>
      ))}
      <h3 style={{marginTop:20}}>Add New Light</h3>
      <label>Light Name</label><input value={name} onChange={e=>setName(e.target.value)} />
      <label>Is this a safety issue?</label>
      <YesNo value={safety} onChange={setSafety} />
      {!safety && (<><label>Feedback to show drivers</label><textarea value={feedback} onChange={e=>setFeedback(e.target.value)} /></>)}
      <label>Specific to one van? (optional)</label>
      <select value={vanId} onChange={e=>setVanId(e.target.value)}>
        <option value="">All vans</option>
        {vans.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
      </select>
      <button className="primary" disabled={!name} onClick={()=>{onAdd(name,safety,feedback,vanId); setName('');setFeedback('');setVanId('');setSafety(false);}}>Add Light</button>
    </div>
  );
}

// ---------- Root App ----------
function LoginScreen(){
  function signIn(){
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(err=>alert('Sign-in failed: '+err.message));
  }
  return (
    <div className="content">
      <div className="login-mark">🚐</div>
      <div className="login-title">RCC Van Admin</div>
      <p className="login-sub">Sign in to manage the fleet and driver approvals.</p>
      <button id="googleSignInBtn" onClick={signIn}>
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </button>
    </div>
  );
}

// Loads admin-only collections (maintenance, repairs, alerts, all
// users) only once the admin dashboard is actually opened, instead of
// on every sign-in. Shows a brief loading state the first time, then
// stays subscribed for the rest of the session so switching tabs is
// instant afterward.
function AdminDataLoader({vans,rentals,warningLights}){
  const [maintenanceNotes,setMaintenanceNotes] = useState([]);
  const [repairLog,setRepairLog] = useState([]);
  const [alerts,setAlerts] = useState([]);
  const [allUsers,setAllUsers] = useState([]);
  const [recurringRequests,setRecurringRequests] = useState([]);
  const [ready,setReady] = useState(false);

  useEffect(()=>{
    const unsubs = [];
    unsubs.push(db.collection('vanMaintenanceNotes').onSnapshot(s=>setMaintenanceNotes(s.docs.map(d=>({id:d.id,...d.data()})))));
    unsubs.push(db.collection('vanRepairLog').onSnapshot(s=>setRepairLog(s.docs.map(d=>({id:d.id,...d.data()})))));
    unsubs.push(db.collection('vanAlerts').onSnapshot(s=>setAlerts(s.docs.map(d=>({id:d.id,...d.data()})))));
    unsubs.push(db.collection('vanRecurringRequests').onSnapshot(s=>setRecurringRequests(s.docs.map(d=>({id:d.id,...d.data()})))));
    unsubs.push(db.collection('users').onSnapshot(s=>{setAllUsers(s.docs.map(d=>({id:d.id,...d.data()}))); setReady(true);}));
    return ()=>unsubs.forEach(u=>u());
  },[]);

  if(!ready){
    return <div className="content"><div className="loading">Loading admin data...</div></div>;
  }
  return <AdminDashboard allUsers={allUsers} vans={vans} rentals={rentals} warningLights={warningLights} maintenanceNotes={maintenanceNotes} repairLog={repairLog} alerts={alerts} recurringRequests={recurringRequests} />;
}

function App(){
  const [user,setUser] = useState(undefined); // undefined = checking, null = signed out
  const [canAccessAdmin,setCanAccessAdmin] = useState(false);
  const [checkedAccess,setCheckedAccess] = useState(false);
  const [vans,setVans] = useState([]);
  const [rentals,setRentals] = useState([]);
  const [warningLights,setWarningLights] = useState([]);
  const [loadingData,setLoadingData] = useState(true);

  useEffect(()=>{
    auth.onAuthStateChanged(async u=>{
      setUser(u);
      if(u){
        await ensureVansSeeded();
        await ensureWarningLightsSeeded();
        const doc = await db.collection('users').doc(u.uid).get();
        const data = doc.exists ? doc.data() : {};
        setCanAccessAdmin(data.isAdmin===true || (data.roles && data.roles.vanAdmin===true));
      } else {
        setCanAccessAdmin(false);
      }
      setCheckedAccess(true);
    });
  },[]);

  useEffect(()=>{
    if(!user || !canAccessAdmin) return;
    const unsubs = [];
    unsubs.push(db.collection('vans').onSnapshot(s=>setVans(s.docs.map(d=>({id:d.id,...d.data()})))));
    unsubs.push(db.collection('vanRentals').onSnapshot(s=>setRentals(s.docs.map(d=>({id:d.id,...d.data()})))));
    unsubs.push(db.collection('vanWarningLights').onSnapshot(s=>setWarningLights(s.docs.map(d=>({id:d.id,...d.data()})))));
    setLoadingData(false);
    return ()=>unsubs.forEach(u=>u());
  },[user,canAccessAdmin]);

  if(user===undefined || !checkedAccess){
    return <div className="app"><div className="loading">Loading...</div></div>;
  }
  if(!user){
    return (
      <div className="app">
        <TopBar title="RCC Van Admin" hubLink />
        <LoginScreen />
      </div>
    );
  }
  if(!canAccessAdmin){
    return (
      <div className="app">
        <TopBar title="Van Admin" hubLink right={<button className="plain" onClick={()=>auth.signOut()}>Sign out</button>} />
        <div className="content">
          <div className="card center">
            <h2>Access Restricted</h2>
            <p className="muted">This page is limited to Van Usage admins. Ask an owner or admin if you believe this is a mistake.</p>
            <a className="link-btn" href="index.html">← Back to Van Usage</a>
          </div>
        </div>
      </div>
    );
  }
  if(loadingData){
    return <div className="app"><div className="loading">Loading admin data...</div></div>;
  }

  return (
    <div className="app">
      <TopBar
        title="Van Admin"
        hubLink
        right={<>
          <a className="plain" href="index.html" style={{textDecoration:'none', display:'inline-block', textAlign:'center'}}>Driver view</a>
          <button className="plain" onClick={()=>auth.signOut()}>Sign out</button>
        </>}
      />
      <AdminDataLoader vans={vans} rentals={rentals} warningLights={warningLights} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
