// Seed vans once if the collection is empty (first-run convenience only)
async function ensureVansSeeded() {
  const snap = await db.collection('vans').limit(1).get();
  if (!snap.empty) return;
  const seed = [{
    name: 'White Chevy Van (low priority use)',
    mileage: 52310,
    gas: 75,
    status: 'available',
    lowPriority: true
  }, {
    name: 'Brown GMC Van',
    mileage: 88120,
    gas: 40,
    status: 'available',
    lowPriority: false
  }, {
    name: 'White Ford Van',
    mileage: 31200,
    gas: 90,
    status: 'available',
    lowPriority: false
  }];
  const batch = db.batch();
  seed.forEach(v => {
    const ref = db.collection('vans').doc();
    batch.set(ref, v);
  });
  await batch.commit();
}
async function ensureWarningLightsSeeded() {

    batch.set(ref, l);
